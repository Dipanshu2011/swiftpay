<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b1b"><title>SwiftPays | Security Check</title>
<link rel="preconnect" href="https://challenges.cloudflare.com">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root{color-scheme:dark;--bg:#050b1b;--panel:#0b1730;--line:#1b4d83;--cyan:#20d9ff;--muted:#a9bfdf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 5%,#087cff38,transparent 42%),radial-gradient(ellipse at 90% 95%,#00cfff20,transparent 36%),var(--bg);font-family:Inter,system-ui,Arial,sans-serif;color:#eaf4ff}
.card{width:min(100%,480px);padding:34px 26px;border:1px solid #1b4d83;border-radius:26px;background:linear-gradient(145deg,#0c1b38f5,#081329f5);box-shadow:0 24px 80px #0008;text-align:center}
.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand b{color:var(--cyan)}.gem{font-size:31px;display:block;margin:28px 0 10px;filter:drop-shadow(0 0 14px #20d9ff88)}
h1{font-size:25px;margin:10px 0}.sub{color:var(--muted);font-size:15px;line-height:1.65;margin:0 auto 24px;max-width:360px}
.verify-wrap{min-height:78px;display:flex;justify-content:center;align-items:center;margin:14px auto 16px}.status{font-size:13px;color:var(--muted);min-height:22px}.status.error{color:#ff8d9b}.status.ok{color:#71e6b0}
.spinner{width:24px;height:24px;border:3px solid #25476d;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.foot{color:#7189ad;font-size:11px;margin-top:25px}.secure{color:#78dfff;font-size:12px;font-weight:750;letter-spacing:1px}
@media(max-width:420px){.card{padding:28px 18px}.brand{font-size:23px}}
</style>
</head>
<body>
<main class="card">
  <div class="brand">✦ Swift<b>Pays</b></div>
  <span class="gem">💎</span>
  <div class="secure">✨ SECURE ACCESS ✨</div>
  <h1>Verifying your connection</h1>
  <p class="sub">Please complete this quick security check to continue safely to SwiftPays.</p>
  <div class="verify-wrap"><div id="turnstile-widget"></div></div>
  <div id="status" class="status" role="status" aria-live="polite"><div class="spinner"></div>Preparing secure verification…</div>
  <div class="foot">🔐 Protected by Cloudflare Turnstile · SwiftPays</div>
</main>
<script>
(() => {
  "use strict";
  const API_BASE = "https://swiftpay-api-6azu.onrender.com";
  const statusEl = document.getElementById("status");
  const say = (message, kind="") => { statusEl.className = "status " + kind; statusEl.textContent = message; };
  const goHome = () => { sessionStorage.setItem("swiftpays_verified_at", String(Date.now())); window.location.replace("/home.html"); };
  if (sessionStorage.getItem("swiftpays_verified_at") && Date.now()-Number(sessionStorage.getItem("swiftpays_verified_at")) < 4*60*60*1000) { goHome(); return; }

  async function boot() {
    try {
      const response = await fetch(API_BASE + "/public/config", {headers:{"Accept":"application/json"}});
      if (!response.ok) throw new Error("Security settings could not be loaded. Please try again later.");
      const config = await response.json();
      if (config.maintenance_mode) throw new Error("SwiftPays is temporarily unavailable for maintenance.");
      if (!config.turnstile_enabled || !config.turnstile_site_key) throw new Error("Security verification is not configured yet. Please contact the website owner.");
      const waitForTurnstile = () => new Promise((resolve,reject) => {
        let attempts=0;
        const timer=setInterval(() => {
          if (window.turnstile) {clearInterval(timer);resolve();}
          else if (++attempts>100) {clearInterval(timer);reject(new Error("Cloudflare verification did not load. Check your connection and refresh."));}
        },100);
      });
      await waitForTurnstile();
      window.turnstile.render("#turnstile-widget", {
        sitekey: config.turnstile_site_key,
        theme: "dark",
        size: "flexible",
        callback: async (token) => {
          say("✨ Checking your verification…");
          try {
            const verify = await fetch(API_BASE + "/verify-turnstile", {
              method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
              body:JSON.stringify({token})
            });
            const result = await verify.json().catch(()=>({}));
            if (!verify.ok || !result.success) throw new Error(result.detail || "Verification failed. Please try again.");
            say("✅ Verified successfully. Opening SwiftPays…","ok");
            goHome();
          } catch (error) { say(error.message || "Verification failed. Please try again.","error"); }
        },
        "expired-callback": () => say("Verification expired. Please complete it again.","error"),
        "error-callback": () => say("Cloudflare could not verify this browser. Refresh and try again.","error")
      });
      say("Complete the Cloudflare check below to continue.");
    } catch (error) { say(error.message || "Unable to start security verification.","error"); }
  }
  boot();
})();
</script>
</body></html>
