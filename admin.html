
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftPays Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
    background:
      radial-gradient(ellipse at 10% 90%, #006b5c 0%, transparent 35%),
      radial-gradient(ellipse at 90% 10%, #004b47 0%, transparent 35%),
      #001b20;
}

.login-card {
    width: 100%;
    max-width: 770px;
    padding: 55px 55px 45px;
    text-align: center;
    border: 2px solid #00bba9;
    border-radius: 43px;
    background: rgba(0, 22, 27, .88);
    box-shadow: 0 0 35px rgba(0, 210, 180, .10);
}

.brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-bottom: 42px;
}

.logo {
    width: 105px;
    height: 105px;
    object-fit: contain;
    flex-shrink: 0;
}

.brand-name {
    text-align: left;
}

.brand-name h1 {
    font-size: 45px;
    font-weight: 800;
    letter-spacing: -2px;
}

.brand-name h1 span {
    color: #00d5a0;
}

.brand-name p {
    display: inline-block;
    margin-top: 7px;
    padding: 7px 22px;
    border-radius: 20px;
    background: #063b40;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
}

h2 {
    font-size: 39px;
    margin-bottom: 15px;
}

.subtitle {
    color: #b7cbd0;
    font-size: 19px;
    margin-bottom: 43px;
}

.input-box {
    display: flex;
    align-items: center;
    width: 100%;
    height: 74px;
    border: 1px solid #07545a;
    border-radius: 17px;
    margin-bottom: 25px;
    padding: 0 25px;
    background: rgba(0, 35, 40, .55);
}

.input-box span {
    font-size: 25px;
    margin-right: 22px;
}

.input-box input {
    width: 100%;
    color: white;
    font-size: 19px;
    border: none;
    outline: none;
    background: transparent;
}

.input-box input::placeholder {
    color: #b6c8ce;
}

.eye {
    cursor: pointer;
    font-size: 22px;
    margin-left: 12px;
}

.login-btn {
    width: 100%;
    height: 76px;
    margin-top: 10px;
    border: 1px solid #00e2a5;
    border-radius: 17px;
    background: linear-gradient(100deg, #00c995, #00a77f);
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:disabled {
    opacity: .65;
    cursor: not-allowed;
}

.notice {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    margin-top: 30px;
    color: #c3d4d8;
    font-size: 17px;
}

.notice span {
    color: #00d5a0;
    font-size: 23px;
}

.footer {
    margin-top: 38px;
    color: #83aeb5;
    font-size: 16px;
}

.error {
    display: none;
    color: #ff8585;
    background: rgba(255, 50, 50, .10);
    border: 1px solid rgba(255, 80, 80, .3);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 18px;
    font-size: 14px;
}

@media(max-width: 600px) {
    .login-card {
        padding: 35px 22px;
        border-radius: 28px;
    }

    .brand {
        gap: 12px;
        margin-bottom: 35px;
    }

    .logo {
        width: 72px;
        height: 72px;
    }

    .brand-name h1 {
        font-size: 31px;
    }

    .brand-name p {
        font-size: 12px;
        padding: 6px 13px;
    }

    h2 {
        font-size: 30px;
    }

    .subtitle {
        font-size: 15px;
    }

    .input-box {
        height: 62px;
        padding: 0 15px;
    }

    .input-box input {
        font-size: 16px;
    }

    .login-btn {
        height: 65px;
        font-size: 19px;
    }

    .notice {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="brand">

        <!-- SWIFTPAYS LOGO -->
        <svg class="logo" viewBox="0 0 120 120"
             xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#00e5a5"/>
                    <stop offset="100%" stop-color="#00a98c"/>
                </linearGradient>
            </defs>
            <path fill="url(#logoGradient)"
              d="M91 12H48C22 12 12 31 12 48c0 18 13 31 32 31h35c8 0 12 5 12 12s-5 15-15 15H19v-20h56c-4-7-12-11-22-11H43C21 75 7 60 7 42 7 20 24 2 49 2h42z"
              transform="translate(5 4)"/>
        </svg>

        <div class="brand-name">
            <h1>Swift<span>Pays</span></h1>
            <p>ADMIN PANEL</p>
        </div>

    </div>

    <h2>Admin Login</h2>
    <p class="subtitle">Sign in to access the SwiftPays dashboard</p>

    <div class="error" id="errorBox"></div>

    <form id="loginForm">

        <div class="input-box">
            <span>✉</span>
            <input
                type="email"
                id="email"
                placeholder="Admin Gmail"
                autocomplete="username"
                required>
        </div>

        <div class="input-box">
            <span>🔒</span>
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required>
            <span class="eye" id="togglePassword">◉</span>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
            ➜ &nbsp; Login to Dashboard
        </button>

    </form>

    <div class="notice">
        <span>⬡</span>
        Only authorized admin accounts can access this panel.
    </div>

    <div class="footer">
        SwiftPays • Admin Control Panel
    </div>

</div>

<script type="module">
import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "AIzaSyA_KW4G3pdXu2VKTqa2-Sk9xE4hzDIWU9I",
    authDomain: "swiftpay-d0bd2.firebaseapp.com",
    projectId: "swiftpay-d0bd2",
    storageBucket: "swiftpay-d0bd2.firebasestorage.app",
    messagingSenderId: "83327557267",
    appId: "1:83327557267:web:a5605f47bc72ae4190f766"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* BACKEND URL */
const API_URL = "https://swiftpay-api-6azu.onrender.com";

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("errorBox");
const passwordInput = document.getElementById("password");

/* PASSWORD SHOW / HIDE */
document.getElementById("togglePassword").addEventListener("click", () => {
    passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
});

/* ERROR MESSAGE */
function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

/* ADMIN LOGIN */
form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorBox.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Verifying Admin...";

    try {
        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        /* FIREBASE LOGIN */
        const credential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const idToken = await credential.user.getIdToken(true);

        /* BACKEND OWNER / ADMIN CHECK */
        const response = await fetch(`${API_URL}/admin/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                firebase_id_token: idToken
            })
        });

        const result = await response.json();

        if (!response.ok || result.authorized !== true) {
            await signOut(auth);
            throw new Error(
                result.detail || result.message ||
                "This account is not authorized for admin access."
            );
        }

        /* SAVE VERIFIED LOGIN DETAILS */
        sessionStorage.setItem("swiftpays_admin_verified", "true");
        sessionStorage.setItem("swiftpays_admin_role", result.role);
        sessionStorage.setItem("swiftpays_admin_permissions",
            JSON.stringify(result.permissions || []));

        /* OPEN DASHBOARD */
        window.location.href = "/admin-dashboard.html";

    } catch (error) {
        showError(error.message || "Login failed. Please try again.");
        loginBtn.disabled = false;
        loginBtn.textContent = "➜  Login to Dashboard";
    }
});
</script>

</body>
</html>
