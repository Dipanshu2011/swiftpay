
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131b">
  <title>SwiftPays | Owner Login</title>

  <style>
    :root {
      --bg:#061219;
      --panel:#0d1d27;
      --line:#203743;
      --muted:#91a6b2;
      --text:#f4f8fa;
      --green:#00e5a8;
      --red:#ff858d;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      padding:24px 16px;
      display:grid;
      place-items:center;
      background:radial-gradient(
        circle at 50% 8%,
        #123039 0,
        #07151d 45%,
        #040c12 100%
      );
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
    }

    .card {
      width:min(100%,560px);
      padding:42px;
      border:1px solid #263b46;
      border-radius:36px;
      background:linear-gradient(
        145deg,
        rgba(17,34,45,.98),
        rgba(7,23,30,.98)
      );
      box-shadow:0 28px 90px #0008;
    }

    .brand {
      text-align:center;
    }

    .logo {
      width:108px;
      height:108px;
      margin:0 auto 30px;
      border:1px solid #29444b;
      border-radius:30px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#183039,#10252c);
      box-shadow:0 15px 40px #0004;
      overflow:hidden;
    }

    .logo img {
      width:100%;
      height:100%;
      object-fit:contain;
      padding:8px;
    }

    h1 {
      font-size:46px;
      line-height:1;
      margin:0 0 20px;
      font-weight:800;
      letter-spacing:-2px;
    }

    .eyebrow {
      font-size:15px;
      letter-spacing:3px;
      font-weight:800;
      color:#9aadb8;
      margin-bottom:25px;
    }

    .subtitle {
      font-size:18px;
      color:#a8bac3;
      margin:0 0 38px;
    }

    label {
      display:block;
      font-weight:700;
      color:#a9bbc5;
      margin:0 0 12px;
      font-size:16px;
    }

    input {
      width:100%;
      height:68px;
      padding:0 18px;
      border:1px solid #29414c;
      border-radius:22px;
      background:#06151c;
      color:#fff;
      font-size:17px;
      outline:none;
      margin-bottom:24px;
    }

    input:focus {
      border-color:var(--green);
      box-shadow:0 0 0 3px #00e5a81c;
    }

    .password-wrap {
      position:relative;
    }

    .password-wrap input {
      padding-right:66px;
    }

    .toggle {
      position:absolute;
      right:12px;
      top:8px;
      width:48px;
      height:48px;
      border:0;
      background:transparent;
      color:#9fb2bc;
      font-size:20px;
      cursor:pointer;
    }

    .message {
      display:none;
      margin:0 0 20px;
      padding:14px 16px;
      border-radius:14px;
      font-size:14px;
      line-height:1.5;
    }

    .message.error {
      display:block;
      background:#35191e;
      color:#ff9da3;
      border:1px solid #71323a;
    }

    .message.success {
      display:block;
      background:#0b3028;
      color:#75f2c8;
      border:1px solid #1b6a55;
    }

    button.submit {
      width:100%;
      height:76px;
      border:0;
      border-radius:22px;
      background:linear-gradient(100deg,#00d99e,#00edb2);
      color:#04251d;
      font-size:19px;
      font-weight:850;
      cursor:pointer;
    }

    button:disabled {
      opacity:.55;
      cursor:wait;
    }

    .foot {
      text-align:center;
      color:#8299a5;
      font-size:13px;
      margin:26px 0 0;
    }

    .foot a {
      color:var(--green);
      text-decoration:none;
    }

    .security {
      margin-top:20px;
      text-align:center;
      color:#728b97;
      font-size:12px;
    }

    @media(max-width:520px) {
      .card {
        padding:34px 24px;
        border-radius:30px;
      }

      h1 {
        font-size:40px;
      }

      .logo {
        width:96px;
        height:96px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <header class="brand">

      <!-- SWIFTPAYS LOGO -->
      <div class="logo">
        <img
          src="https://swiftpays.pages.dev/logo.png"
          alt="SwiftPays Logo"
          onerror="this.style.display='none';this.parentElement.textContent='ϟ';"
        >
      </div>

      <h1>SwiftPays</h1>

      <div class="eyebrow">
        OWNER ACCESS PORTAL
      </div>

      <p class="subtitle">
        Sign in to your SwiftPays control panel
      </p>

    </header>

    <form id="adminForm">

      <label for="email">
        Owner Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter owner email"
        required
      >

      <label for="password">
        Password
      </label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

        <button
          class="toggle"
          type="button"
          id="togglePassword"
          aria-label="Show password"
        >◉</button>

      </div>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <button
        class="submit"
        id="loginButton"
        type="submit"
      >
        LOGIN SECURELY →
      </button>

    </form>

    <p class="foot">
      <a href="/">
        ← Back to SwiftPays website
      </a>
    </p>

    <p class="security">
      Restricted owner access · Protected by Firebase Authentication
    </p>

  </main>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_KW4G3pdXu2VKTqa2-Sk9xE4hzDIWU9I",
      authDomain: "swiftpay-d0bd2.firebaseapp.com",
      databaseURL: "https://swiftpay-d0bd2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "swiftpay-d0bd2",
      storageBucket: "swiftpay-d0bd2.firebasestorage.app",
      messagingSenderId: "83327557267",
      appId: "1:83327557267:web:a5605f47bc72ae4190f766",
      measurementId: "G-2Y21LJQTRZ"
    };

    const API_BASE =
      "https://swiftpay-api-6azu.onrender.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form =
      document.getElementById("adminForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginButton");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    /* PASSWORD VISIBILITY */

    document
      .getElementById("togglePassword")
      .addEventListener("click", () => {

        const field =
          document.getElementById("password");

        field.type =
          field.type === "password"
            ? "text"
            : "password";

      });

    /* OWNER LOGIN */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document
        .getElementById("email")
        .value.trim();

      const password = document
        .getElementById("password")
        .value;

      button.disabled = true;
      button.textContent = "VERIFYING OWNER...";

      message.className = "message";
      message.textContent = "";

      try {

        // Firebase Authentication

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        // Get Firebase ID Token

        const idToken =
          await credential.user.getIdToken(true);

        // Backend Owner Verification

        const response = await fetch(
          `${API_BASE}/admin/login`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${idToken}`
            },

            body: JSON.stringify({
              firebase_id_token: idToken
            })
          }
        );

        const result =
          await response.json().catch(() => ({}));

        // Owner Access Check

        if (
          !response.ok ||
          result.authorized !== true ||
          result.role !== "owner"
        ) {

          await signOut(auth).catch(() => {});

          sessionStorage.removeItem(
            "swiftpays_admin_id_token"
          );

          throw new Error(
            result.detail ||
            result.message ||
            "This account is not authorized as the SwiftPays owner."
          );

        }

        // Save Session

        sessionStorage.setItem(
          "swiftpays_admin_id_token",
          idToken
        );

        showMessage(
          "Owner verified. Opening Admin Dashboard...",
          "success"
        );

        // Open Dashboard

        window.location.replace(
          "/admin-dashboard/"
        );

      } catch (error) {

        const code = error?.code || "";

        const friendly = {

          "auth/invalid-credential":
            "Incorrect email or password.",

          "auth/user-not-found":
            "No account found with this email.",

          "auth/wrong-password":
            "Incorrect email or password.",

          "auth/invalid-email":
            "Please enter a valid email address.",

          "auth/too-many-requests":
            "Too many attempts. Please try again later.",

          "auth/network-request-failed":
            "Network error. Check your internet connection."

        };

        showMessage(
          friendly[code] ||
          error.message ||
          "Login failed. Please try again."
        );

      } finally {

        button.disabled = false;
        button.textContent = "LOGIN SECURELY →";

      }

    });

  </script>

</body>
</html>
