
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05091e">
<title>Create Account | SwiftPays</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:20px 14px;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
color:#fff;
background:
radial-gradient(ellipse at 0% 10%,#0756a955,transparent 38%),
radial-gradient(ellipse at 100% 85%,#7015a955,transparent 38%),
#030719;
}

.card{
width:100%;
max-width:650px;
padding:28px;
border:2px solid transparent;
border-radius:30px;
background:
linear-gradient(145deg,#06132cf5,#080b25f8) padding-box,
linear-gradient(135deg,#13dff4,#286bff 50%,#b23cff) border-box;
box-shadow:0 0 35px #078bff30,0 24px 80px #0009;
}

.brand{
display:flex;
justify-content:center;
align-items:center;
margin-bottom:23px;
}

.logo{
width:82px;
height:82px;
object-fit:cover;
border-radius:23px;
background:#102b60;
border:2px solid #13dff4;
box-shadow:0 0 12px #13dff466,0 0 25px #286bff33;
display:block;
}

.hero{
text-align:center;
margin-bottom:28px;
}

h1{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.subtitle{
color:#bdcbed;
font-size:14px;
line-height:1.7;
}

label{
display:block;
margin:20px 0 9px;
color:#e1eaff;
font-size:15px;
font-weight:800;
}

.field{position:relative}

.field input{
width:100%;
height:64px;
padding:0 18px 0 58px;
border:1.5px solid #247fc9;
border-radius:17px;
background:linear-gradient(110deg,#10274a,#101534);
color:white;
font-size:16px;
outline:none;
}

.field input:focus{
border-color:#13dff4;
box-shadow:0 0 0 3px #12dff422;
}

.field input::placeholder{color:#a7b8d7}

.field-icon{
position:absolute;
left:17px;
top:50%;
transform:translateY(-50%);
font-size:21px;
z-index:2;
pointer-events:none;
}

.mobile-input{padding-left:85px!important}

.country-code{
position:absolute;
left:17px;
top:50%;
transform:translateY(-50%);
z-index:2;
font-size:15px;
font-weight:800;
pointer-events:none;
}

.password-input{padding-right:65px!important}

.toggle{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
border:0;
background:transparent;
font-size:23px;
cursor:pointer;
padding:7px;
}

.hint{
margin:8px 2px 0;
color:#91a6ca;
font-size:12px;
line-height:1.5;
}

.cloudflare-box{
width:100%;
min-height:100px;
margin-top:26px;
padding:14px 8px;
display:flex;
justify-content:center;
align-items:center;
border:1px solid #247fc9;
border-radius:17px;
background:#101534;
overflow:hidden;
}

#turnstile-container{
width:100%;
min-height:65px;
display:flex;
justify-content:center;
align-items:center;
}

.submit{
width:100%;
min-height:68px;
margin-top:25px;
border:0;
border-radius:18px;
background:linear-gradient(105deg,#08d9e8,#1768f5 55%,#a52dff);
color:white;
font-size:18px;
font-weight:900;
cursor:pointer;
box-shadow:0 10px 32px #1768f555;
}

.submit:disabled{
opacity:.6;
cursor:wait;
}

.status{
min-height:22px;
margin-top:15px;
text-align:center;
font-size:13px;
line-height:1.5;
color:#bdcbed;
overflow-wrap:anywhere;
}

.status.error{color:#ff8585}
.status.success{color:#43eab0}

.switch{
margin-top:25px;
padding-top:22px;
border-top:1px solid #ffffff24;
text-align:center;
color:#c2cee8;
font-size:14px;
}

.switch a{
color:#24e0f2;
font-weight:900;
text-decoration:none;
margin-left:5px;
}

.footer{
text-align:center;
margin-top:23px;
color:#879abd;
font-size:11px;
}

@media(max-width:480px){
.card{padding:27px 18px}
h1{font-size:29px}
.field input{height:62px}
.logo{
width:76px;
height:76px;
border-radius:21px;
}
}
</style>
</head>

<body>

<main class="card">

<header class="brand">
<img
class="logo"
src="https://swiftpays.pages.dev/logo.png"
alt="SwiftPays Logo">
</header>

<div class="hero">
<h1>Create Account</h1>
<p class="subtitle">
✨ Join SwiftPays and enjoy secure, fast and reliable payment services.
</p>
</div>

<form id="registerForm" autocomplete="on">

<label for="name">👤 Full Name</label>

<div class="field">
<span class="field-icon">👤</span>
<input
type="text"
id="name"
name="name"
maxlength="80"
autocomplete="name"
placeholder="Enter your full name"
required>
</div>

<label for="mobile">📱 Mobile Number</label>

<div class="field">
<span class="country-code">🇮🇳 +91</span>
<input
type="tel"
id="mobile"
name="mobile"
class="mobile-input"
inputmode="numeric"
maxlength="10"
pattern="[6-9][0-9]{9}"
autocomplete="tel-national"
placeholder="10-digit mobile number"
required>
</div>

<p class="hint">
Enter your active 10-digit Indian mobile number.
</p>

<label for="password">🔐 Password</label>

<div class="field">
<span class="field-icon">🔐</span>

<input
type="password"
id="password"
name="password"
class="password-input"
minlength="8"
maxlength="128"
autocomplete="new-password"
placeholder="Enter your password"
required>

<button
type="button"
class="toggle"
id="togglePassword"
aria-label="Show password">🙈</button>
</div>

<p class="hint">
Password must contain at least 8 characters.
</p>

<div class="cloudflare-box">
<div id="turnstile-container"></div>
</div>

<button
type="submit"
class="submit"
id="submitBtn">
CREATE ACCOUNT →
</button>

<div class="status" id="status" role="status" aria-live="polite"></div>

</form>

<div class="switch">
Already have an account?
<a href="/login">Login Now</a>
</div>

<div class="footer">
© 2026 SwiftPays. All Rights Reserved.
</div>

</main>

<script>
"use strict";

/* =====================================
   SWIFTPAYS API
===================================== */

const API_BASE = "https://swiftpay-api-6azu.onrender.com";

let cloudflareToken = "";
let turnstileWidgetId = null;
let isSubmitting = false;

const form = document.getElementById("registerForm");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const submitBtn = document.getElementById("submitBtn");

/* =====================================
   STATUS
===================================== */

function showStatus(message,type=""){
    const status = document.getElementById("status");
    status.textContent = message;
    status.className = "status " + type;
}

/* =====================================
   PASSWORD SHOW / HIDE
===================================== */

togglePassword.addEventListener("click",function(){

    const hidden = passwordInput.type === "password";

    passwordInput.type = hidden ? "text" : "password";

    togglePassword.textContent = hidden ? "👁️" : "🙈";

    togglePassword.setAttribute(
        "aria-label",
        hidden ? "Hide password" : "Show password"
    );

});

/* =====================================
   MOBILE VALIDATION
===================================== */

document.getElementById("mobile").addEventListener("input",function(){

    this.value = this.value.replace(/\D/g,"").slice(0,10);

});

/* =====================================
   WAIT FOR CLOUDFLARE
===================================== */

function waitForTurnstile(siteKey){

    let attempts = 0;

    const timer = setInterval(function(){

        attempts++;

        if(window.turnstile){

            clearInterval(timer);
            renderTurnstile(siteKey);

        }else if(attempts >= 100){

            clearInterval(timer);

            showStatus(
                "Cloudflare could not load. Please refresh.",
                "error"
            );

        }

    },200);

}

/* =====================================
   LOAD CLOUDFLARE CONFIG
===================================== */

async function loadCloudflare(){

    try{

        const response = await fetch(
            API_BASE + "/public/config",
            {
                method:"GET",
                cache:"no-store"
            }
        );

        const config = await response.json();

        if(!response.ok){
            throw new Error(
                config.detail || "Security configuration unavailable."
            );
        }

        const siteKey = (
            config.turnstile_site_key || config.site_key || ""
        ).trim();

        if(!siteKey || config.turnstile_enabled === false){
            throw new Error("Cloudflare Site Key is not configured.");
        }

        waitForTurnstile(siteKey);

    }catch(error){

        showStatus(error.message,"error");

    }

}

/* =====================================
   RENDER TURNSTILE
===================================== */

function renderTurnstile(siteKey){

    try{

        turnstileWidgetId = window.turnstile.render(
            "#turnstile-container",
            {
                sitekey:siteKey,
                theme:"dark",
                size:"normal",

                callback:function(token){

                    cloudflareToken = token;

                    showStatus(
                        "Cloudflare verification completed.",
                        "success"
                    );

                },

                "expired-callback":function(){

                    cloudflareToken = "";

                    showStatus(
                        "Verification expired. Please verify again.",
                        "error"
                    );

                },

                "error-callback":function(){

                    cloudflareToken = "";

                    showStatus(
                        "Cloudflare verification failed. Please retry.",
                        "error"
                    );

                }
            }
        );

    }catch(error){

        showStatus(
            "Unable to display Cloudflare verification.",
            "error"
        );

    }

}

/* =====================================
   CREATE ACCOUNT
===================================== */

form.addEventListener("submit",async function(event){

    event.preventDefault();

    if(isSubmitting)return;

    const name = document.getElementById("name").value.trim();

    const mobile = document.getElementById("mobile").value.trim();

    const password = passwordInput.value;

    /* Name */

    if(name.length < 2){

        showStatus("Please enter your full name.","error");
        return;

    }

    /* Mobile */

    if(!/^[6-9][0-9]{9}$/.test(mobile)){

        showStatus(
            "Please enter a valid 10-digit Indian mobile number.",
            "error"
        );

        return;

    }

    /* Password */

    if(password.length < 8){

        showStatus(
            "Password must contain at least 8 characters.",
            "error"
        );

        return;

    }

    /* Cloudflare */

    if(!cloudflareToken){

        showStatus(
            "Please complete Cloudflare verification first.",
            "error"
        );

        return;

    }

    isSubmitting = true;

    submitBtn.disabled = true;
    submitBtn.textContent = "VERIFYING...";

    showStatus("Verifying your registration...");

    try{

        const response = await fetch(
            API_BASE + "/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name:name,
                    mobile:mobile,
                    password:password,
                    turnstile_token:cloudflareToken
                })
            }
        );

        const result = await response.json().catch(function(){
            return {};
        });

        if(!response.ok){

            throw new Error(
                result.detail ||
                result.message ||
                "Registration failed. Please try again."
            );

        }

        /*
          REQUIRED BACKEND RESPONSE:

          {
            "success": true,
            "pin_setup_required": true,
            "setup_token": "temporary-token"
          }
        */

        if(
            result.success !== true ||
            result.pin_setup_required !== true ||
            !result.setup_token
        ){

            throw new Error(
                "Backend did not return the S-PIN setup token. Check Render deployment."
            );

        }

        /* SAVE TEMPORARY TOKEN */

        sessionStorage.setItem(
            "swiftpays_setup_token",
            result.setup_token
        );

        showStatus(
            "Details verified! Redirecting to S-PIN setup...",
            "success"
        );

        /* REDIRECT WITH TOKEN */

        const pinURL =
            "/create-pin?token=" +
            encodeURIComponent(result.setup_token);

        setTimeout(function(){

            window.location.replace(pinURL);

        },600);

    }catch(error){

        showStatus(
            error.message || "Something went wrong.",
            "error"
        );

        cloudflareToken = "";

        if(window.turnstile && turnstileWidgetId !== null){

            try{
                window.turnstile.reset(turnstileWidgetId);
            }catch(resetError){}

        }

        isSubmitting = false;

        submitBtn.disabled = false;
        submitBtn.textContent = "CREATE ACCOUNT →";

    }

});

/* =====================================
   INITIALIZE
===================================== */

loadCloudflare();

</script>

</body>
  </html>
