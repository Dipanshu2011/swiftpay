
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05091e">
<title>Create Account | SwiftPays</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at 0% 10%, #0756a955, transparent 38%),
    radial-gradient(ellipse at 100% 85%, #7015a955, transparent 38%),
    #030719;
}

.card {
  width: 100%;
  max-width: 650px;
  padding: 30px 28px;
  border: 2px solid transparent;
  border-radius: 30px;
  background:
    linear-gradient(145deg, #06132cf5, #080b25f8) padding-box,
    linear-gradient(135deg, #13dff4, #286bff 50%, #b23cff) border-box;
  box-shadow: 0 0 35px #078bff30, 0 24px 80px #0009;
}

/* LOGO */

.brand {
  text-align: center;
  margin-bottom: 22px;
}

.logo {
  width: 115px;
  height: 115px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 0 14px #16dfff66);
}

/* SHIELD */

.shield {
  width: 110px;
  height: 115px;
  margin: 0 auto 12px;
  filter: drop-shadow(0 0 16px #00cfff66);
}

.shield svg {
  width: 100%;
  height: 100%;
}

.hero {
  text-align: center;
  margin-bottom: 28px;
}

h1 {
  font-size: 34px;
  font-weight: 900;
  margin-bottom: 10px;
}

.subtitle {
  color: #bdcbed;
  font-size: 14px;
  line-height: 1.7;
}

/* FORM LABELS */

label {
  display: block;
  margin: 20px 0 9px;
  color: #e1eaff;
  font-size: 15px;
  font-weight: 800;
}

.field {
  position: relative;
}

.field input {
  width: 100%;
  height: 64px;
  padding: 0 18px 0 58px;
  border: 1.5px solid #247fc9;
  border-radius: 17px;
  background: linear-gradient(110deg, #10274a, #101534);
  color: white;
  font-size: 16px;
  outline: none;
}

.field input:focus {
  border-color: #13dff4;
  box-shadow: 0 0 0 3px #12dff422;
}

.field input::placeholder {
  color: #a7b8d7;
}

.field-icon {
  position: absolute;
  left: 17px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 21px;
  z-index: 2;
}

/* MOBILE */

.mobile-input {
  padding-left: 85px !important;
}

.country-code {
  position: absolute;
  left: 17px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
  font-size: 15px;
  font-weight: 800;
}

/* PASSWORD */

.password-input {
  padding-right: 65px !important;
}

.toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  font-size: 23px;
  cursor: pointer;
  padding: 7px;
}

.hint {
  margin: 8px 2px 0;
  color: #91a6ca;
  font-size: 12px;
  line-height: 1.5;
}

/* CLOUDFLARE */

.cloudflare-box {
  width: 100%;
  min-height: 105px;
  margin-top: 26px;
  padding: 16px 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid #247fc9;
  border-radius: 17px;
  background: #101534;
  overflow: hidden;
}

#turnstile-container {
  width: 100%;
  min-height: 65px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#turnstile-container iframe {
  max-width: 100%;
}

/* BUTTON */

.submit {
  width: 100%;
  min-height: 68px;
  margin-top: 25px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(105deg, #08d9e8, #1768f5 55%, #a52dff);
  color: white;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 10px 32px #1768f555;
}

.submit:disabled {
  opacity: .6;
  cursor: wait;
}

.status {
  min-height: 22px;
  margin-top: 15px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: #bdcbed;
}

.status.error {
  color: #ff8585;
}

.status.success {
  color: #43eab0;
}

/* LOGIN */

.switch {
  margin-top: 25px;
  padding-top: 22px;
  border-top: 1px solid #ffffff24;
  text-align: center;
  color: #c2cee8;
  font-size: 14px;
}

.switch a {
  color: #24e0f2;
  font-weight: 900;
  text-decoration: none;
  margin-left: 5px;
}

.footer {
  text-align: center;
  margin-top: 23px;
  color: #879abd;
  font-size: 11px;
}

@media(max-width:480px) {
  .card {
    padding: 27px 18px;
  }

  h1 {
    font-size: 29px;
  }

  .field input {
    height: 62px;
  }

  .logo {
    width: 105px;
    height: 105px;
  }
}
</style>
</head>

<body>

<main class="card">

  <!-- SWIFTPAYS LOGO ONLY -->
  <header class="brand">
    <img
      class="logo"
      src="https://swiftpays.pages.dev/logo.png"
      alt="SwiftPays Logo"
      onerror="this.style.display='none'"
    >
  </header>

  <!-- SECURITY SHIELD -->
  <div class="hero">

    <div class="shield">
      <svg viewBox="0 0 120 130" fill="none">
        <defs>
          <linearGradient id="shieldGradient" x1="10" y1="5" x2="110" y2="125">
            <stop stop-color="#16eaff"/>
            <stop offset=".55" stop-color="#2777ff"/>
            <stop offset="1" stop-color="#bd43ff"/>
          </linearGradient>
        </defs>

        <path d="M60 7 105 25v35c0 30-18 49-45 63C33 109 15 90 15 60V25L60 7Z"
          stroke="url(#shieldGradient)"
          stroke-width="5"
          fill="#0c2550"/>

        <circle cx="60" cy="47" r="13" fill="url(#shieldGradient)"/>

        <path d="M34 88c2-16 12-25 26-25s24 9 26 25"
          stroke="url(#shieldGradient)"
          stroke-width="9"
          stroke-linecap="round"/>

        <circle cx="91" cy="88" r="17"
          fill="#06254b"
          stroke="#13e4ef"
          stroke-width="4"/>

        <path d="m83 88 6 6 11-13"
          stroke="#55f4e5"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
      ✨ Join SwiftPays and enjoy secure, fast and reliable payment services.
    </p>

  </div>

  <form id="registerForm" autocomplete="on">

    <!-- FULL NAME -->
    <label for="name">👤 Full Name</label>

    <div class="field">
      <span class="field-icon">👤</span>

      <input
        type="text"
        id="name"
        name="name"
        maxlength="80"
        autocomplete="name"
        placeholder="Enter your full name"
        required
      >
    </div>

    <!-- MOBILE NUMBER -->
    <label for="mobile">📱 Mobile Number</label>

    <div class="field">
      <span class="country-code">🇮🇳 +91</span>

      <input
        type="tel"
        id="mobile"
        name="mobile"
        class="mobile-input"
        inputmode="numeric"
        maxlength="10"
        pattern="[6-9][0-9]{9}"
        autocomplete="tel-national"
        placeholder="10-digit mobile number"
        required
      >
    </div>

    <p class="hint">
      Enter your active 10-digit Indian mobile number.
    </p>

    <!-- PASSWORD -->
    <label for="password">🔐 Password</label>

    <div class="field">

      <span class="field-icon">🔐</span>

      <input
        type="password"
        id="password"
        name="password"
        class="password-input"
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
        placeholder="Enter your password"
        required
      >

      <button
        type="button"
        class="toggle"
        id="togglePassword"
        aria-label="Show password"
      >🙈</button>

    </div>

    <p class="hint">
      Password must contain at least 8 characters.
    </p>

    <!-- CLOUDFLARE WIDGET ONLY -->
    <div class="cloudflare-box">
      <div id="turnstile-container"></div>
    </div>

    <!-- CREATE ACCOUNT -->
    <button type="submit" class="submit" id="submitBtn">
      CREATE ACCOUNT →
    </button>

    <div class="status" id="status"></div>

  </form>

  <!-- LOGIN -->
  <div class="switch">
    Already have an account?
    <a href="/login">Login Now</a>
  </div>

  <div class="footer">
    © 2026 SwiftPays. All Rights Reserved.
  </div>

</main>

<script>
/* =====================================
   SWIFTPAYS CONFIGURATION
===================================== */

const API_BASE = "https://swiftpay-api-6azu.onrender.com";

let cloudflareToken = "";
let turnstileWidgetId = null;

/* =====================================
   PASSWORD SHOW / HIDE
===================================== */

const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function() {

  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";

  togglePassword.textContent = isHidden ? "👁️" : "🙈";

  togglePassword.setAttribute(
    "aria-label",
    isHidden ? "Hide password" : "Show password"
  );

});

/* =====================================
   STATUS MESSAGE
===================================== */

function showStatus(message, type = "") {

  const status = document.getElementById("status");

  status.textContent = message;
  status.className = "status " + type;

}

/* =====================================
   LOAD CLOUDFLARE SITE KEY
===================================== */

async function loadCloudflare() {

  const container = document.getElementById("turnstile-container");

  try {

    const response = await fetch(API_BASE + "/public/config", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Security configuration unavailable.");
    }

    const config = await response.json();

    const siteKey =
      config.turnstile_site_key || config.site_key;

    if (!siteKey) {
      throw new Error("Cloudflare Site Key not found.");
    }

    waitForTurnstile(siteKey);

  } catch (error) {

    showStatus(
      "Cloudflare configuration could not be loaded. Please refresh.",
      "error"
    );

  }

}

/* =====================================
   WAIT FOR CLOUDFLARE SCRIPT
===================================== */

function waitForTurnstile(siteKey) {

  let attempts = 0;

  const timer = setInterval(function() {

    attempts++;

    if (window.turnstile) {

      clearInterval(timer);
      renderTurnstile(siteKey);

    } else if (attempts > 100) {

      clearInterval(timer);

      showStatus(
        "Cloudflare could not be loaded. Please refresh.",
        "error"
      );

    }

  }, 200);

}

/* =====================================
   RENDER CLOUDFLARE
===================================== */

function renderTurnstile(siteKey) {

  const container = document.getElementById("turnstile-container");

  container.innerHTML = "";

  try {

    turnstileWidgetId = window.turnstile.render(
      container,
      {
        sitekey: siteKey,
        theme: "dark",
        size: "normal",

        callback: function(token) {

          cloudflareToken = token;
          showStatus("");

        },

        "expired-callback": function() {

          cloudflareToken = "";

        },

        "error-callback": function() {

          cloudflareToken = "";

          showStatus(
            "Cloudflare verification failed. Please retry.",
            "error"
          );

        }

      }
    );

  } catch (error) {

    showStatus(
      "Unable to display Cloudflare verification.",
      "error"
    );

  }

}

/* =====================================
   REGISTRATION SUBMIT
===================================== */

document.getElementById("registerForm").addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = passwordInput.value;

    const submitBtn = document.getElementById("submitBtn");

    if (!name) {
      showStatus("Please enter your full name.", "error");
      return;
    }

    if (!/^[6-9][0-9]{9}$/.test(mobile)) {
      showStatus("Please enter a valid 10-digit mobile number.", "error");
      return;
    }

    if (password.length < 8) {
      showStatus("Password must contain at least 8 characters.", "error");
      return;
    }

    if (!cloudflareToken) {
      showStatus("Please complete Cloudflare verification first.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "CREATING ACCOUNT...";

    showStatus("Verifying your registration...");

    try {

      /*
        Backend must verify the Turnstile token
        using the Cloudflare Secret Key.
      */

      const verifyResponse = await fetch(
        API_BASE + "/verify-turnstile",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: cloudflareToken
          })
        }
      );

      const verifyResult = await verifyResponse.json().catch(() => ({}));

      if (!verifyResponse.ok || verifyResult.success !== true) {
        throw new Error(
          verifyResult.detail ||
          verifyResult.message ||
          "Cloudflare verification failed."
        );
      }

      /*
        Registration API
      */

      const registerResponse = await fetch(
        API_BASE + "/auth/register",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: name,
            mobile: mobile,
            password: password
          })
        }
      );

      const result = await registerResponse.json().catch(() => ({}));

      if (!registerResponse.ok || result.success !== true) {
        throw new Error(
          result.detail ||
          result.message ||
          "Registration failed."
        );
      }

      showStatus(
        "Account created successfully! Redirecting...",
        "success"
      );

      /*
        Backend must establish a secure one-time
        PIN setup session before redirecting.
      */

      window.location.replace("/create-pin");

    } catch (error) {

      showStatus(
        error.message || "Something went wrong.",
        "error"
      );

      cloudflareToken = "";

      if (window.turnstile && turnstileWidgetId !== null) {
        window.turnstile.reset(turnstileWidgetId);
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "CREATE ACCOUNT →";

    }

  }
);

/* =====================================
   START
===================================== */

loadCloudflare();

</script>

</body>
          </html>
