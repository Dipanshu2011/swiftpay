
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | SwiftPays</title>

<script>
document.documentElement.style.visibility="hidden";

(async()=>{
 const token=localStorage.getItem("swiftpays_token");
 if(!token){location.replace("/login");return;}

 try{
  const r=await fetch("https://swiftpay-api-6azu.onrender.com/user/me",{
   headers:{Authorization:"Bearer "+token},
   cache:"no-store"
  });

  if(r.status===401||r.status===403){
   localStorage.removeItem("swiftpays_token");
   location.replace("/login");
   return;
  }
  if(!r.ok)throw new Error();

  document.documentElement.style.visibility="visible";
 }catch(e){
  document.addEventListener("DOMContentLoaded",()=>{
   document.body.innerHTML=`
   <div style="background:#061326;color:white;min-height:100vh;
   display:grid;place-items:center;text-align:center;font-family:Arial">
   <div><h2>Connection Error</h2>
   <p>Unable to verify your session.</p>
   <button onclick="location.reload()">Retry</button></div></div>`;
   document.documentElement.style.visibility="visible";
  });
 }
})();
</script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:25px 15px;background:#061326;
 color:white;font-family:Arial,sans-serif;overflow-x:hidden
}
.outer-background{
 position:fixed;inset:0;overflow:hidden;z-index:-1;
 background:
 radial-gradient(circle at 15% 20%,#063b62,transparent 35%),
 radial-gradient(circle at 85% 80%,#071f58,transparent 40%),#061326
}
.outer-glow{
 position:absolute;width:350px;height:350px;border-radius:50%;
 filter:blur(90px);opacity:.35;
 animation:glowMove 9s ease-in-out infinite alternate
}
.glow-one{background:#00cfff;top:-120px;left:-100px}
.glow-two{background:#1265ff;bottom:-150px;right:-100px;animation-delay:2s}
@keyframes glowMove{to{transform:translate(100px,80px)}}

.floating-logo{
 position:absolute;width:65px;opacity:.13;
 animation:floatLogo 12s ease-in-out infinite
}
.logo-one{top:12%;left:9%}
.logo-two{top:65%;left:15%;animation-delay:2s}
.logo-three{top:20%;right:12%;animation-delay:4s}
.logo-four{bottom:8%;right:12%;animation-delay:1s}
@keyframes floatLogo{
 0%,100%{transform:translateY(0) rotate(0)}
 50%{transform:translateY(-35px) rotate(12deg)}
}
.light-wave{
 position:absolute;width:150%;height:180px;left:-25%;top:45%;
 border-top:1px solid rgba(0,217,255,.25);border-radius:50%;
 transform:rotate(-12deg);filter:blur(2px);
 animation:waveMove 10s linear infinite
}
.wave-two{top:55%;border-color:rgba(28,100,255,.25);
 animation-duration:14s;animation-direction:reverse}
@keyframes waveMove{
 from{transform:translateX(-5%) rotate(-12deg)}
 to{transform:translateX(5%) rotate(-12deg)}
}
.particle{
 position:absolute;width:3px;height:3px;border-radius:50%;
 background:#00d9ff;box-shadow:0 0 10px #00d9ff;
 animation:particleFloat 8s linear infinite
}
@keyframes particleFloat{
 0%{transform:translateY(30px);opacity:0}
 20%{opacity:.8}
 100%{transform:translateY(-120px);opacity:0}
}

/* STATIC CARD */
.card{
 width:100%;max-width:410px;background:#0d1d35;
 border:1px solid #17466b;border-radius:23px;
 padding:27px 25px;box-shadow:0 20px 70px #0006;
 position:relative;z-index:2
}
.brand{text-align:center;margin-bottom:27px}
.brand img{width:69px;height:69px;object-fit:contain}
.brand-name{
 color:#00d9ff;font-size:27px;font-weight:800;
 letter-spacing:2px;margin-top:7px
}
.brand-subtitle{
 font-size:9px;letter-spacing:2px;color:#8da9c4;margin-top:5px
}
h2{text-align:center;font-size:23px;margin:0 0 9px}
.description{
 color:#8fa9c4;font-size:13px;text-align:center;
 line-height:1.5;margin:0 0 25px
}
.field{margin-bottom:17px}
label{display:block;font-size:12px;color:#b7c9dc;margin-bottom:8px}
.input-wrap{position:relative}
input{
 width:100%;height:53px;padding:0 48px 0 15px;
 background:#08172a;border:1px solid #294766;
 border-radius:11px;outline:none;color:white;font-size:14px
}
input:focus{border-color:#00d9ff;box-shadow:0 0 0 2px #00d9ff19}
input::placeholder{color:#60758c}
.toggle{
 position:absolute;right:13px;top:50%;transform:translateY(-50%);
 cursor:pointer;font-size:18px;user-select:none
}
button{
 width:100%;height:53px;border:0;border-radius:11px;
 background:linear-gradient(100deg,#00d9ff,#087dff);
 color:#041426;font-size:15px;font-weight:800;cursor:pointer;margin-top:7px
}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
 display:none;padding:12px;border-radius:9px;font-size:12px;
 line-height:1.5;margin-top:15px;text-align:center
}
.message.success{display:block;background:#00dc961a;
 border:1px solid #00dc964d;color:#5dffc4}
.message.error{display:block;background:#ff465a1a;
 border:1px solid #ff465a4d;color:#ff8794}
.back-link{
 display:block;text-align:center;color:#00d9ff;
 font-size:12px;text-decoration:none;margin-top:22px
}
.security-note{text-align:center;color:#718ba6;font-size:10px;margin-top:19px}
</style>
</head>

<body>

<div class="outer-background">
 <div class="outer-glow glow-one"></div>
 <div class="outer-glow glow-two"></div>
 <img class="floating-logo logo-one" src="https://swiftpays.pages.dev/logo.png">
 <img class="floating-logo logo-two" src="https://swiftpays.pages.dev/logo.png">
 <img class="floating-logo logo-three" src="https://swiftpays.pages.dev/logo.png">
 <img class="floating-logo logo-four" src="https://swiftpays.pages.dev/logo.png">
 <div class="light-wave"></div>
 <div class="light-wave wave-two"></div>
</div>

<div class="card">
 <div class="brand">
  <img src="https://swiftpays.pages.dev/logo.png" alt="SwiftPays">
  <div class="brand-name">SWIFTPAYS</div>
  <div class="brand-subtitle">SECURE PAYMENT EXPERIENCE</div>
 </div>

 <h2>Change Password</h2>
 <p class="description">Update your account password to keep your account secure.</p>

 <form id="passwordForm">
  <div class="field">
   <label>Current Password</label>
   <div class="input-wrap">
    <input type="password" id="currentPassword"
    placeholder="Enter current password" required autocomplete="current-password">
    <span class="toggle" onclick="toggleVisibility('currentPassword',this)">🙈</span>
   </div>
  </div>

  <div class="field">
   <label>New Password</label>
   <div class="input-wrap">
    <input type="password" id="newPassword"
    placeholder="Minimum 8 characters" required minlength="8"
    autocomplete="new-password">
    <span class="toggle" onclick="toggleVisibility('newPassword',this)">🙈</span>
   </div>
  </div>

  <div class="field">
   <label>Confirm New Password</label>
   <div class="input-wrap">
    <input type="password" id="confirmPassword"
    placeholder="Confirm new password" required minlength="8"
    autocomplete="new-password">
    <span class="toggle" onclick="toggleVisibility('confirmPassword',this)">🙈</span>
   </div>
  </div>

  <button type="submit" id="submitBtn">UPDATE PASSWORD</button>
  <div class="message" id="message"></div>
 </form>

 <a href="/dashboard" class="back-link">← Back to Dashboard</a>
 <div class="security-note">🔒 Your security is our priority.</div>
</div>

<script>
/* FLOATING PARTICLES */
for(let i=0;i<24;i++){
 const p=document.createElement("div");
 p.className="particle";
 p.style.left=Math.random()*100+"%";
 p.style.top=Math.random()*100+"%";
 p.style.animationDelay=Math.random()*8+"s";
 p.style.animationDuration=(6+Math.random()*7)+"s";
 document.querySelector(".outer-background").appendChild(p);
}

function toggleVisibility(id,el){
 const input=document.getElementById(id);
 if(input.type==="password"){
  input.type="text";el.textContent="👁️";
 }else{
  input.type="password";el.textContent="🙈";
 }
}

function showMessage(text,type){
 const box=document.getElementById("message");
 box.textContent=text;
 box.className="message "+type;
}

document.getElementById("passwordForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const currentPassword=document.getElementById("currentPassword").value;
 const newPassword=document.getElementById("newPassword").value;
 const confirmPassword=document.getElementById("confirmPassword").value;
 const button=document.getElementById("submitBtn");
 const token=localStorage.getItem("swiftpays_token");

 document.getElementById("message").className="message";

 if(!token){location.replace("/login");return;}

 if(newPassword.length<8){
  showMessage("New password must contain at least 8 characters.","error");
  return;
 }
 if(newPassword!==confirmPassword){
  showMessage("New password and confirmation do not match.","error");
  return;
 }
 if(currentPassword===newPassword){
  showMessage("New password must be different from current password.","error");
  return;
 }

 button.disabled=true;
 button.textContent="UPDATING...";

 try{
  const response=await fetch(
   "https://swiftpay-api-6azu.onrender.com/auth/change-password",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+token
    },
    body:JSON.stringify({
     current_password:currentPassword,
     new_password:newPassword
    })
   }
  );

  const result=await response.json().catch(()=>({}));

  if(response.status===401 &&
     /session|token|expired|invalid/i.test(result.detail||"")){
   localStorage.removeItem("swiftpays_token");
   location.replace("/login");
   return;
  }

  if(!response.ok){
   throw new Error(result.detail||result.message||"Password update failed.");
  }

  showMessage(result.message||"Password changed successfully!","success");
  document.getElementById("passwordForm").reset();

  setTimeout(()=>location.href="/dashboard",1500);

 }catch(error){
  showMessage(error.message||"Something went wrong. Please try again.","error");
 }finally{
  button.disabled=false;
  button.textContent="UPDATE PASSWORD";
 }
});
</script>
</body>
</html>
