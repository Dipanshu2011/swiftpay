
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | SwiftPays</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
  background: #071225;
  color: #fff;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 570px;
  padding: 38px 36px;
  background: #101f38;
  border: 1px solid #203d60;
  border-radius: 25px;
  box-shadow: 0 15px 45px #0006;
}

.logo {
  display: block;
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin: 0 auto 12px;
}

.brand {
  text-align: center;
  color: #08c9f5;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 38px;
}

h2 {
  text-align: center;
  font-size: 28px;
  margin: 0 0 12px;
}

.sub {
  text-align: center;
  color: #9eb2cc;
  font-size: 16px;
  line-height: 1.6;
  margin: 0 0 30px;
}

label {
  display: block;
  margin: 20px 0 10px;
  font-size: 16px;
  color: #c9d8eb;
}

.field {
  position: relative;
}

input {
  width: 100%;
  height: 58px;
  padding: 15px 65px 15px 15px;
  border: 1px solid #294565;
  border-radius: 13px;
  background: #09172b;
  color: #fff;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #00d5ff;
  box-shadow: 0 0 10px #00d5ff20;
}

input::placeholder {
  color: #657d9a;
}

.eye {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #9eb2cc;
  font-size: 14px;
  user-select: none;
}

button {
  width: 100%;
  height: 60px;
  margin-top: 25px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(90deg, #00bce9, #087dff);
  color: #fff;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  display: none;
  font-size: 14px;
  text-align: center;
  margin-top: 18px;
  line-height: 1.5;
}

.back {
  display: block;
  text-align: center;
  color: #00d5ff;
  margin-top: 28px;
  text-decoration: none;
  font-size: 16px;
}

.footer {
  text-align: center;
  color: #8198b3;
  font-size: 13px;
  margin-top: 30px;
}

@media(max-width: 480px) {
  .card {
    padding: 28px 20px;
    border-radius: 22px;
  }

  .brand {
    font-size: 27px;
    margin-bottom: 30px;
  }

  h2 {
    font-size: 25px;
  }

  .sub {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="https://swiftpays.pages.dev/logo.png"
    alt="SwiftPays Logo"
  >

  <div class="brand">SWIFTPAYS</div>

  <h2>Change Password</h2>

  <p class="sub">
    Protect your account with a strong password.
  </p>

  <form id="passwordForm">

    <label>🔐 Current Password</label>
    <div class="field">
      <input
        id="currentPassword"
        type="password"
        placeholder="Enter current password"
        required
        maxlength="128"
        autocomplete="current-password"
      >
      <span class="eye"
        onclick="toggle('currentPassword',this)">Show</span>
    </div>

    <label>🔐 New Password</label>
    <div class="field">
      <input
        id="newPassword"
        type="password"
        placeholder="Enter new password"
        required
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
      >
      <span class="eye"
        onclick="toggle('newPassword',this)">Show</span>
    </div>

    <label>🔐 Confirm New Password</label>
    <div class="field">
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        required
        minlength="8"
        maxlength="128"
        autocomplete="new-password"
      >
      <span class="eye"
        onclick="toggle('confirmPassword',this)">Show</span>
    </div>

    <button id="submitBtn" type="submit">
      Update Password
    </button>

  </form>

  <div id="message" role="status"></div>

  <a class="back" href="/dashboard">
    ← Back to Dashboard
  </a>

  <div class="footer">
    🔒 Your password is securely protected by SwiftPays.
  </div>

</div>

<script>
const API = "https://swiftpay-api-6azu.onrender.com";

function toggle(id, el) {
  const input = document.getElementById(id);

  input.type =
    input.type === "password" ? "text" : "password";

  el.textContent =
    input.type === "password" ? "Show" : "Hide";
}

document.getElementById("passwordForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const current_password =
    document.getElementById("currentPassword").value;

  const new_password =
    document.getElementById("newPassword").value;

  const confirm_password =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");

  const btn =
    document.getElementById("submitBtn");

  message.style.display = "block";
  message.style.color = "#ff9b9b";

  if (new_password.length < 8) {
    message.textContent =
      "New password must be at least 8 characters.";
    return;
  }

  if (new_password !== confirm_password) {
    message.textContent =
      "New password and confirm password do not match.";
    return;
  }

  if (current_password === new_password) {
    message.textContent =
      "New password must be different.";
    return;
  }

  const token =
    localStorage.getItem("swiftpays_token");

  if (!token) {
    message.textContent =
      "Please login again to change your password.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Updating...";

  try {

    const response = await fetch(
      API + "/auth/change-password",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          current_password,
          new_password
        })
      }
    );

    const raw = await response.text();

    let result = {};

    try {
      result = raw ? JSON.parse(raw) : {};
    } catch {
      result = { detail: raw };
    }

    if (!response.ok) {
      throw new Error(
        result.detail ||
        result.message ||
        "Password update failed."
      );
    }

    message.style.color = "#48e6a2";
    message.textContent =
      "Password changed successfully! Redirecting...";

    document.getElementById("passwordForm").reset();

    btn.textContent = "Password Updated";

    setTimeout(function() {
      window.location.replace("/dashboard");
    }, 1500);

  } catch(error) {

    message.style.color = "#ff9b9b";
    message.textContent =
      error.message || "Something went wrong.";

    btn.disabled = false;
    btn.textContent = "Update Password";
  }

});
</script>

</body>
</html>
