
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Change S-PIN | SwiftPays</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #0d1b2b;
      border: 1px solid rgba(0, 220, 255, 0.2);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 0 35px rgba(0, 200, 255, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .logo h2 {
      color: #00d9ff;
      font-size: 25px;
      letter-spacing: 1px;
    }

    .heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .heading p {
      color: #8fa8bd;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #c8d8e8;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .input-box {
      position: relative;
    }

    .input-box input {
      width: 100%;
      height: 52px;
      background: #071321;
      border: 1px solid #243d52;
      border-radius: 11px;
      outline: none;
      color: #fff;
      padding: 0 48px 0 15px;
      font-size: 18px;
      letter-spacing: 7px;
      transition: 0.2s;
    }

    .input-box input:focus {
      border-color: #00d9ff;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.12);
    }

    .input-box input::placeholder {
      color: #526779;
      letter-spacing: 3px;
      font-size: 14px;
    }

    .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 21px;
      user-select: none;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #00d9ff, #008cff);
      color: #03111c;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      min-height: 18px;
    }

    .back {
      display: block;
      text-align: center;
      color: #00d9ff;
      text-decoration: none;
      margin-top: 22px;
      font-size: 13px;
    }

    .security-note {
      margin-top: 20px;
      text-align: center;
      color: #71899d;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      <img src="https://swiftpays.pages.dev/logo.png" alt="SwiftPays Logo">
      <h2>SWIFTPAYS</h2>
    </div>

    <div class="heading">
      <h1>Change S-PIN</h1>
      <p>Update your six-digit security PIN to keep your account protected.</p>
    </div>

    <form id="pinForm">

      <div class="field">
        <label for="currentPin">Current S-PIN</label>
        <div class="input-box">
          <input
            type="password"
            id="currentPin"
            placeholder="••••••"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            autocomplete="current-password"
            required
          >
          <span class="eye" onclick="toggle('currentPin', this)">🙈</span>
        </div>
      </div>

      <div class="field">
        <label for="newPin">New S-PIN</label>
        <div class="input-box">
          <input
            type="password"
            id="newPin"
            placeholder="••••••"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            autocomplete="new-password"
            required
          >
          <span class="eye" onclick="toggle('newPin', this)">🙈</span>
        </div>
      </div>

      <div class="field">
        <label for="confirmPin">Confirm New S-PIN</label>
        <div class="input-box">
          <input
            type="password"
            id="confirmPin"
            placeholder="••••••"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            autocomplete="new-password"
            required
          >
          <span class="eye" onclick="toggle('confirmPin', this)">🙈</span>
        </div>
      </div>

      <button type="submit" id="submitBtn">
        Update S-PIN
      </button>

      <div class="message" id="message" role="status" aria-live="polite"></div>

    </form>

    <a href="/dashboard" class="back">← Back to Dashboard</a>

    <div class="security-note">
      🔒 Your S-PIN is securely protected by SwiftPays.
    </div>

  </main>

  <script>
    const API_URL = "https://swiftpay-api-6azu.onrender.com";

    // Show / Hide S-PIN
    function toggle(id, el) {
      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        el.textContent = "👁️";
      } else {
        input.type = "password";
        el.textContent = "🙈";
      }
    }

    // Allow numbers only
    ["currentPin", "newPin", "confirmPin"].forEach(id => {
      const input = document.getElementById(id);

      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "").slice(0, 6);
      });
    });

    // Change S-PIN
    document.getElementById("pinForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const currentPin = document.getElementById("currentPin").value;
      const newPin = document.getElementById("newPin").value;
      const confirmPin = document.getElementById("confirmPin").value;

      const message = document.getElementById("message");
      const button = document.getElementById("submitBtn");

      message.style.color = "#ff6b6b";
      message.textContent = "";

      if (!/^[0-9]{6}$/.test(currentPin) ||
          !/^[0-9]{6}$/.test(newPin) ||
          !/^[0-9]{6}$/.test(confirmPin)) {
        message.textContent = "Please enter all S-PINs as exactly 6 digits.";
        return;
      }

      if (newPin !== confirmPin) {
        message.textContent = "New S-PIN and confirmation do not match.";
        return;
      }

      if (currentPin === newPin) {
        message.textContent = "New S-PIN must be different from current S-PIN.";
        return;
      }

      const token = localStorage.getItem("swiftpays_token");

      if (!token) {
        message.textContent = "Session expired. Please login again.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        const response = await fetch(`${API_URL}/auth/change-pin`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            current_pin: currentPin,
            new_pin: newPin
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || data.message || "Unable to change S-PIN."
          );
        }

        message.style.color = "#48e6a2";
        message.textContent = "S-PIN changed successfully! Redirecting...";

        document.getElementById("pinForm").reset();

        // Redirect immediately after successful change
        window.location.replace("/dashboard");
        return;

      } catch (error) {
        message.style.color = "#ff6b6b";
        message.textContent = error.message || "Something went wrong. Please try again.";

        button.disabled = false;
        button.textContent = "Update S-PIN";
      }
    });
  </script>

</body>
</html>
