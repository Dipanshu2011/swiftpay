
<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(async function () {
  const token = localStorage.getItem("swiftpays_token");

  if (!token) {
    location.replace("/login?next=" + encodeURIComponent("/change-pin.html"));
    return;
  }

  try {
    const response = await fetch(
      "https://swiftpay-api-6azu.onrender.com/user/me",
      {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      localStorage.removeItem("swiftpays_token");
      location.replace("/login?next=" + encodeURIComponent("/change-pin.html"));
      return;
    }

    document.documentElement.style.visibility = "visible";

  } catch (error) {
    document.documentElement.style.visibility = "visible";
    document.body.innerHTML =
      "<div style='background:#071225;color:white;min-height:100vh;display:grid;place-items:center;text-align:center;padding:25px;font-family:Arial'><div><h2>Connection Error</h2><p>Unable to verify your login. Please check your internet connection and reload.</p><button onclick='location.reload()'>Retry</button></div></div>";
  }
})();
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050d1c">
<title>Change S-PIN | SwiftPays</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  overflow-x: hidden;
  position: relative;
  color: white;
  background: #050d1c;
}

/* =========================
   OUTSIDE CARD ANIMATION
========================= */

.outer-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(circle at 10% 15%, #073b55, transparent 38%),
    radial-gradient(circle at 90% 85%, #082b58, transparent 38%),
    #050d1c;
}

/* Background glow */
.outer-glow {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .35;
  animation: glowMove 9s ease-in-out infinite alternate;
}

.glow-one {
  background: #00cfff;
  top: -120px;
  left: -100px;
}

.glow-two {
  background: #075bff;
  bottom: -130px;
  right: -100px;
  animation-delay: 3s;
}

@keyframes glowMove {
  from {
    transform: translate(0, 0) scale(.9);
  }
  to {
    transform: translate(80px, 65px) scale(1.3);
  }
}

/* Floating SwiftPays logos */
.floating-logo {
  position: absolute;
  width: 85px;
  height: 85px;
  object-fit: contain;
  opacity: .13;
  filter: drop-shadow(0 0 18px #00cfff);
}

.logo-one {
  top: 12%;
  left: 7%;
  animation: floatOne 8s ease-in-out infinite alternate;
}

.logo-two {
  top: 48%;
  right: 5%;
  animation: floatTwo 10s ease-in-out infinite alternate;
}

.logo-three {
  bottom: 8%;
  left: 24%;
  animation: floatThree 9s ease-in-out infinite alternate;
}

.logo-four {
  top: 75%;
  right: 18%;
  width: 55px;
  height: 55px;
  animation: floatTwo 11s ease-in-out infinite alternate;
}

@keyframes floatOne {
  to {
    transform: translate(25px, 35px) rotate(18deg);
    opacity: .22;
  }
}

@keyframes floatTwo {
  to {
    transform: translate(-25px, -35px) rotate(-18deg);
    opacity: .20;
  }
}

@keyframes floatThree {
  to {
    transform: translate(35px, -25px) rotate(15deg);
    opacity: .20;
  }
}

/* Moving light waves */
.light-wave {
  position: absolute;
  width: 150%;
  height: 150px;
  left: -25%;
  top: 25%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(0,205,255,.15),
    transparent
  );
  filter: blur(35px);
  transform: rotate(-25deg);
  animation: waveMove 9s ease-in-out infinite alternate;
}

.wave-two {
  top: 65%;
  animation-delay: 3s;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(0,90,255,.18),
    transparent
  );
}

@keyframes waveMove {
  from {
    transform: translateX(-12%) rotate(-25deg);
  }
  to {
    transform: translateX(12%) rotate(-25deg);
  }
}

/* Background particles */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #00d9ff;
  box-shadow: 0 0 12px 3px rgba(0,210,255,.5);
  animation: particleFloat linear infinite;
}

@keyframes particleFloat {
  0% {
    transform: translateY(30px);
    opacity: 0;
  }
  20% { opacity: .8; }
  80% { opacity: .7; }
  100% {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* =========================
   MAIN CARD - NO ANIMATION
========================= */

.card {
  position: relative;
  z-index: 2;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  max-width: 410px;
  padding: 27px 25px;
  border-radius: 23px;
  background: #0d1d35;
  border: 1px solid #17466b;
  box-shadow:
    0 20px 55px rgba(0,0,0,.5),
    0 0 25px rgba(0,180,255,.08);
}

/* Brand */
.brand {
  text-align: center;
  margin-bottom: 23px;
}

.main-logo {
  width: 69px;
  height: 69px;
  object-fit: contain;
  border-radius: 17px;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 12px rgba(0,210,255,.3));
}

.brand-name {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #00d5ff;
  text-shadow: 0 0 18px rgba(0,210,255,.25);
}

.brand-sub {
  font-size: 9px;
  letter-spacing: 3px;
  color: #91a9c6;
  margin-top: 5px;
}

/* Heading */
h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 24px;
  color: #fff;
}

/* Input fields */
.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #cbdcf0;
  margin-bottom: 8px;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 53px;
  padding: 0 48px 0 15px;
  background: #08172a;
  border: 1px solid #294766;
  border-radius: 12px;
  outline: none;
  color: #fff;
  font-size: 15px;
  letter-spacing: 4px;
  transition: border-color .2s, box-shadow .2s;
}

input:focus {
  border-color: #00d5ff;
  box-shadow: 0 0 0 3px rgba(0,213,255,.1);
}

input::placeholder {
  color: #657e9a;
  font-size: 12px;
  letter-spacing: 1px;
}

.eye {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 18px;
  user-select: none;
}

/* Update button */
button {
  width: 100%;
  height: 55px;
  margin-top: 8px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(100deg, #00d9ff, #087dff);
  color: #001426;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 7px 22px rgba(0,145,255,.22);
  transition: .2s;
}

button:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

/* Messages */
.message {
  display: none;
  margin-top: 14px;
  padding: 11px;
  border-radius: 10px;
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

.message.success {
  display: block;
  color: #7dffc1;
  background: rgba(0,220,130,.1);
  border: 1px solid rgba(0,220,130,.25);
}

.message.error {
  display: block;
  color: #ffaaaa;
  background: rgba(255,60,60,.1);
  border: 1px solid rgba(255,60,60,.25);
}

/* Dashboard link */
.back {
  display: block;
  text-align: center;
  color: #00d5ff;
  font-size: 13px;
  text-decoration: none;
  margin-top: 21px;
}

.back:hover {
  text-decoration: underline;
}

/* Mobile responsive */
@media(max-width:480px) {
  body {
    padding: 14px;
  }

  .card {
    padding: 25px 19px;
  }

  .brand-name {
    font-size: 25px;
  }

  h1 {
    font-size: 22px;
  }

  .floating-logo {
    width: 65px;
    height: 65px;
  }
}

/* Accessibility */
@media(prefers-reduced-motion: reduce) {
  .outer-background *,
  .card {
    animation: none !important;
  }
}
</style>
</head>

<body>

<!-- Background animations outside the card -->
<div class="outer-background">

  <div class="outer-glow glow-one"></div>
  <div class="outer-glow glow-two"></div>

  <img
    src="https://swiftpays.pages.dev/logo.png"
    class="floating-logo logo-one"
    alt=""
  >

  <img
    src="https://swiftpays.pages.dev/logo.png"
    class="floating-logo logo-two"
    alt=""
  >

  <img
    src="https://swiftpays.pages.dev/logo.png"
    class="floating-logo logo-three"
    alt=""
  >

  <img
    src="https://swiftpays.pages.dev/logo.png"
    class="floating-logo logo-four"
    alt=""
  >

  <div class="light-wave"></div>
  <div class="light-wave wave-two"></div>

</div>

<!-- Main Change PIN Card -->
<div class="card">

  <div class="brand">

    <img
      class="main-logo"
      src="https://swiftpays.pages.dev/logo.png"
      alt="SwiftPays Logo"
    >

    <div class="brand-name">SWIFTPAYS</div>

    <div class="brand-sub">
      SECURE PAYMENT EXPERIENCE
    </div>

  </div>

  <h1>Change S-PIN</h1>

  <form id="pinForm">

    <!-- Current PIN -->
    <div class="field">

      <label for="currentPin">Current S-PIN</label>

      <div class="input-wrap">

        <input
          id="currentPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter current PIN"
          autocomplete="off"
          required
        >

        <span
          class="eye"
          onclick="toggle('currentPin',this)"
        >🙈</span>

      </div>
    </div>

    <!-- New PIN -->
    <div class="field">

      <label for="newPin">New S-PIN</label>

      <div class="input-wrap">

        <input
          id="newPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter new PIN"
          autocomplete="off"
          required
        >

        <span
          class="eye"
          onclick="toggle('newPin',this)"
        >🙈</span>

      </div>
    </div>

    <!-- Confirm PIN -->
    <div class="field">

      <label for="confirmPin">Confirm New S-PIN</label>

      <div class="input-wrap">

        <input
          id="confirmPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="Confirm new PIN"
          autocomplete="off"
          required
        >

        <span
          class="eye"
          onclick="toggle('confirmPin',this)"
        >🙈</span>

      </div>
    </div>

    <button type="submit" id="submitBtn">
      🔐 UPDATE S-PIN
    </button>

    <div class="message" id="message"></div>

  </form>

  <a class="back" href="/dashboard">
    ← Back to Dashboard
  </a>

</div>

<script>

// =========================
// OUTSIDE BACKGROUND PARTICLES
// =========================

const background = document.querySelector(".outer-background");

for (let i = 0; i < 24; i++) {
  const particle = document.createElement("div");

  particle.className = "particle";

  particle.style.left = Math.random() * 100 + "%";
  particle.style.top = (50 + Math.random() * 60) + "%";

  particle.style.animationDelay =
    Math.random() * 8 + "s";

  particle.style.animationDuration =
    (7 + Math.random() * 9) + "s";

  background.appendChild(particle);
}

// =========================
// PIN VISIBILITY
// =========================

function toggle(id, el) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    el.textContent = "👁️";
  } else {
    input.type = "password";
    el.textContent = "🙈";
  }
}

// =========================
// NUMERIC ONLY INPUT
// =========================

["currentPin", "newPin", "confirmPin"].forEach(id => {

  document.getElementById(id).addEventListener("input", function() {

    this.value = this.value.replace(/\D/g, "").slice(0, 6);

  });

});

// =========================
// FORM SUBMISSION
// =========================

const form = document.getElementById("pinForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const current_pin =
    document.getElementById("currentPin").value;

  const new_pin =
    document.getElementById("newPin").value;

  const confirm_pin =
    document.getElementById("confirmPin").value;

  // Validate six digits
  if (![current_pin, new_pin, confirm_pin]
      .every(v => /^\d{6}$/.test(v))) {

    showMessage(
      "All PINs must contain exactly 6 digits.",
      "error"
    );

    return;
  }

  // Confirm PIN
  if (new_pin !== confirm_pin) {

    showMessage(
      "New S-PIN and confirmation do not match.",
      "error"
    );

    return;
  }

  // Different PIN
  if (current_pin === new_pin) {

    showMessage(
      "New S-PIN must be different from current S-PIN.",
      "error"
    );

    return;
  }

  // Check login token
  const token = localStorage.getItem("swiftpays_token");

  if (!token) {

    showMessage(
      "Login required. Redirecting...",
      "error"
    );

    setTimeout(() => {
      location.href = "/login";
    }, 1200);

    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "PLEASE WAIT...";

  try {

    const response = await fetch(
      "https://swiftpay-api-6azu.onrender.com/auth/change-pin",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
          current_pin: current_pin,
          new_pin: new_pin
        })
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.detail ||
        data.message ||
        "Unable to change S-PIN."
      );
    }

    showMessage(
      "✓ S-PIN changed successfully!",
      "success"
    );

    form.reset();

    document.querySelectorAll(".eye").forEach(el => {
      el.textContent = "🙈";
    });

    setTimeout(() => {
      location.href = "/dashboard";
    }, 1500);

  } catch (error) {

    showMessage(error.message, "error");

  } finally {

    submitBtn.disabled = false;
    submitBtn.textContent = "🔐 UPDATE S-PIN";

  }

});

</script>

</body>
  </html>
