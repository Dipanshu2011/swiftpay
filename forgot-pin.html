
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot S-PIN | SwiftPays</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:25px 15px;
  background:#071225;color:#fff;
  font-family:Arial,sans-serif
}

.card{
  width:100%;max-width:570px;padding:38px 36px;
  background:#101f38;border:1px solid #203d60;
  border-radius:25px;box-shadow:0 15px 45px #0006
}

.logo{
  display:block;width:90px;height:90px;
  object-fit:contain;margin:0 auto 12px
}

.brand{
  text-align:center;color:#08c9f5;
  font-size:30px;font-weight:900;
  letter-spacing:1px;margin-bottom:38px
}

h2{text-align:center;font-size:28px;margin:0 0 12px}

.sub{
  text-align:center;color:#9eb2cc;
  font-size:16px;line-height:1.6;
  margin:0 0 30px
}

label{
  display:block;margin:20px 0 10px;
  font-size:16px;color:#c9d8eb
}

.field{position:relative}

input{
  width:100%;height:58px;
  padding:15px 55px 15px 15px;
  border:1px solid #294565;border-radius:13px;
  background:#09172b;color:#fff;
  font-size:16px;outline:none
}

input:focus{
  border-color:#00d5ff;
  box-shadow:0 0 10px #00d5ff20
}

input::placeholder{color:#657d9a}

.pin-input{letter-spacing:4px}

.pin-input::placeholder{letter-spacing:1px}

.eye{
  position:absolute;right:15px;top:50%;
  transform:translateY(-50%);
  cursor:pointer;font-size:21px;
  user-select:none
}

button{
  width:100%;height:60px;margin-top:25px;
  border:0;border-radius:13px;
  background:linear-gradient(90deg,#00bce9,#087dff);
  color:#fff;font-weight:bold;font-size:17px;
  cursor:pointer
}

button:disabled{opacity:.6;cursor:not-allowed}

#message{
  display:none;font-size:14px;
  text-align:center;margin-top:18px;line-height:1.5
}

.back{
  display:block;text-align:center;color:#00d5ff;
  margin-top:28px;text-decoration:none;font-size:16px
}

.footer{
  text-align:center;color:#8198b3;
  font-size:13px;margin-top:30px
}

@media(max-width:480px){
  .card{padding:28px 20px;border-radius:22px}
  .brand{font-size:27px;margin-bottom:30px}
  h2{font-size:25px}
  .sub{font-size:14px}
}
</style>
</head>

<body>

<div class="card">

  <img class="logo"
       src="https://swiftpays.pages.dev/logo.png"
       alt="SwiftPays Logo">

  <div class="brand">SWIFTPAYS</div>

  <h2>Forgot S-PIN</h2>

  <p class="sub">
    Verify your account password and create a new six-digit S-PIN.
  </p>

  <form id="pinForm">

    <label>🔐 Account Password</label>
    <div class="field">
      <input
        id="password"
        type="password"
        placeholder="Enter account password"
        maxlength="128"
        autocomplete="current-password"
        required
      >
      <span class="eye"
        onclick="toggle('password',this)">🙈</span>
    </div>

    <label>🔐 New S-PIN</label>
    <div class="field">
      <input
        id="newPin"
        class="pin-input"
        type="password"
        placeholder="Enter new 6-digit S-PIN"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        autocomplete="off"
        required
      >
      <span class="eye"
        onclick="toggle('newPin',this)">🙈</span>
    </div>

    <label>🔐 Confirm New S-PIN</label>
    <div class="field">
      <input
        id="confirmPin"
        class="pin-input"
        type="password"
        placeholder="Confirm new S-PIN"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        autocomplete="off"
        required
      >
      <span class="eye"
        onclick="toggle('confirmPin',this)">🙈</span>
    </div>

    <button id="submitBtn" type="submit">
      Reset S-PIN
    </button>

  </form>

  <div id="message" role="status"></div>

  <a class="back" href="/dashboard">
    ← Back to Dashboard
  </a>

  <div class="footer">
    🔒 Your S-PIN is securely protected by SwiftPays.
  </div>

</div>

<script>
const API = "https://swiftpay-api-6azu.onrender.com";

function toggle(id, el){
  const input = document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
    el.textContent = "👁️";
  }else{
    input.type = "password";
    el.textContent = "🙈";
  }
}

// Allow only six numeric digits
["newPin","confirmPin"].forEach(id=>{
  document.getElementById(id).addEventListener("input",function(){
    this.value = this.value.replace(/\D/g,"").slice(0,6);
  });
});

document.getElementById("pinForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const new_pin =
    document.getElementById("newPin").value;

  const confirm_pin =
    document.getElementById("confirmPin").value;

  const message = document.getElementById("message");
  const btn = document.getElementById("submitBtn");

  message.style.display = "block";
  message.style.color = "#ff9b9b";

  if(new_pin.length !== 6 || confirm_pin.length !== 6){
    message.textContent =
      "S-PIN must contain exactly 6 digits.";
    return;
  }

  if(new_pin !== confirm_pin){
    message.textContent =
      "New S-PIN and Confirm S-PIN do not match.";
    return;
  }

  const token = localStorage.getItem("swiftpays_token");

  if(!token){
    message.textContent =
      "Please login again to reset your S-PIN.";

    setTimeout(()=>{
      window.location.replace("/login");
    },1200);

    return;
  }

  btn.disabled = true;
  btn.textContent = "Resetting...";

  try{

    const response = await fetch(
      API + "/auth/forgot-pin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
          password:password,
          new_pin:new_pin
        })
      }
    );

    const raw = await response.text();
    let result = {};

    try{
      result = raw ? JSON.parse(raw) : {};
    }catch{
      result = {detail:raw};
    }

    if(!response.ok){
      throw new Error(
        result.detail ||
        result.message ||
        "S-PIN reset failed."
      );
    }

    message.style.color = "#48e6a2";
    message.textContent =
      "S-PIN reset successfully! Redirecting...";

    document.getElementById("pinForm").reset();

    document.querySelectorAll(".eye").forEach(el=>{
      el.textContent = "🙈";
    });

    btn.textContent = "S-PIN Reset";

    setTimeout(()=>{
      window.location.replace("/dashboard");
    },1500);

  }catch(error){

    message.style.color = "#ff9b9b";
    message.textContent =
      error.message || "Something went wrong.";

    btn.disabled = false;
    btn.textContent = "Reset S-PIN";
  }

});
</script>

</body>
</html>
