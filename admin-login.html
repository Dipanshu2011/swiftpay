
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020b1c">
<title>SwiftPays | Admin Portal</title>

<style>
:root{
 --cyan:#00d9ff;
 --blue:#087cff;
 --navy:#020b1c;
 --panel:#071a36;
 --text:#f2f8ff;
 --muted:#a8c1df;
}
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 font-family:Inter,Arial,sans-serif;
 color:var(--text);
 background:
 radial-gradient(ellipse at 15% 10%,#073d7c 0,transparent 35%),
 radial-gradient(ellipse at 90% 90%,#063a72 0,transparent 35%),
 linear-gradient(135deg,#010817,#041630,#020a1b);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:
 linear-gradient(#087cff12 1px,transparent 1px),
 linear-gradient(90deg,#087cff12 1px,transparent 1px);
 background-size:40px 40px;
}

.wave{
 position:fixed;
 left:-10%;
 right:-10%;
 bottom:-175px;
 height:330px;
 border:2px solid #00aaff55;
 border-radius:50%;
 transform:rotate(-7deg);
 box-shadow:0 -12px 35px #007bff22;
 pointer-events:none;
}

.wave:after{
 content:"";
 position:absolute;
 inset:25px 0;
 border-top:2px solid #00d9ff88;
 border-radius:50%;
 filter:drop-shadow(0 0 10px #00cfff);
}

.container{
 width:100%;
 max-width:1120px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:55px;
 align-items:center;
 position:relative;
 z-index:1;
}

/* BRAND AREA */

.brand-area{padding:20px}

.brand{
 display:flex;
 align-items:center;
 gap:15px;
 margin-bottom:55px;
}

.brand-logo{
 width:82px;
 height:82px;
 object-fit:contain;
 filter:drop-shadow(0 0 15px #00cfff);
}

.brand-name{
 font-size:43px;
 font-weight:900;
 letter-spacing:-2px;
}

.brand-name span{color:var(--cyan)}

.shield-area{
 height:330px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
}

.shield{
 width:240px;
 height:275px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(145deg,#078cff,#031b49,#00d9ff);
 clip-path:polygon(50% 0,95% 17%,88% 65%,50% 100%,12% 65%,5% 17%);
 filter:drop-shadow(0 0 25px #008cff);
}

.shield img{
 width:145px;
 height:145px;
 object-fit:contain;
}

.orbit{
 position:absolute;
 width:340px;
 height:85px;
 border:3px solid var(--cyan);
 border-radius:50%;
 transform:rotate(-12deg);
 box-shadow:0 0 20px #008cff;
}

.features{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
}

.feature{
 padding:12px 16px;
 border:1px solid #087cff;
 border-radius:12px;
 background:#061d3d;
 color:#bde7ff;
 font-size:13px;
}

.tagline{
 text-align:center;
 color:#9ecbfa;
 letter-spacing:3px;
 font-size:12px;
 margin-top:25px;
}

/* LOGIN CARD */

.login-card{
 width:100%;
 padding:38px;
 border:1.5px solid #078cff;
 border-radius:28px;
 background:linear-gradient(145deg,#071b39f5,#020d23f7);
 box-shadow:
 0 20px 70px #0009,
 0 0 35px #007cff35,
 inset 0 0 25px #087cff0b;
 position:relative;
}

.login-card:before{
 content:"";
 position:absolute;
 top:0;
 left:10%;
 width:80%;
 height:2px;
 background:linear-gradient(90deg,transparent,var(--cyan),transparent);
 box-shadow:0 0 15px var(--cyan);
}

.card-brand{
 text-align:center;
 margin-bottom:30px;
}

.card-logo{
 width:100px;
 height:100px;
 object-fit:contain;
 filter:drop-shadow(0 0 20px #00cfff);
}

.card-brand h1{
 font-size:32px;
 margin:12px 0 0;
}

.card-brand h1 span{color:var(--cyan)}

.portal{
 display:inline-block;
 margin-top:17px;
 padding:11px 25px;
 border:1px solid var(--cyan);
 border-radius:12px;
 background:#06244b;
 font-size:21px;
 font-weight:850;
 letter-spacing:1px;
 box-shadow:0 0 18px #008cff35;
}

.subtitle{
 color:var(--muted);
 font-size:14px;
 margin-top:12px;
}

.field{margin:20px 0}

.field label{
 display:block;
 margin-bottom:9px;
 font-size:13px;
 font-weight:800;
 color:#d9edff;
 letter-spacing:.7px;
}

.input-box{
 height:62px;
 display:flex;
 align-items:center;
 gap:13px;
 padding:0 16px;
 border:1px solid #087cff;
 border-radius:14px;
 background:#061b38;
 transition:.2s;
}

.input-box:focus-within{
 border-color:var(--cyan);
 box-shadow:
 0 0 0 3px #00d9ff20,
 0 0 20px #087cff45;
}

.input-icon{
 color:var(--cyan);
 font-size:22px;
}

.input-box input{
 flex:1;
 min-width:0;
 border:none;
 outline:none;
 background:transparent !important;
 color:white !important;
 font-size:16px;
}

.input-box input::placeholder{
 color:#91acd0;
}

/* AUTOFILL FIX */

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
 -webkit-text-fill-color:#ffffff !important;
 -webkit-box-shadow:0 0 0 1000px #061b38 inset !important;
 box-shadow:0 0 0 1000px #061b38 inset !important;
 caret-color:white;
}

.eye{
 border:0;
 border-left:1px solid #2368a7;
 background:transparent;
 color:var(--cyan);
 padding:8px 0 8px 14px;
 font-weight:800;
 cursor:pointer;
}

.remember{
 display:flex;
 align-items:center;
 gap:11px;
 margin:20px 0 25px;
 color:#d7eaff;
 font-size:14px;
}

.remember input{
 width:19px;
 height:19px;
 accent-color:#087cff;
}

.submit{
 width:100%;
 height:65px;
 border:1px solid var(--cyan);
 border-radius:15px;
 background:linear-gradient(100deg,#078cff,#075ce7,#00c9ff);
 color:white;
 font-size:19px;
 font-weight:900;
 cursor:pointer;
 box-shadow:0 0 25px #087cff55;
 transition:.2s;
}

.submit:hover{
 filter:brightness(1.15);
 transform:translateY(-2px);
}

.submit:disabled{
 opacity:.6;
 cursor:wait;
 transform:none;
}

.message{
 display:none;
 padding:12px;
 border-radius:10px;
 margin:15px 0;
 font-size:13px;
}

.error{
 background:#351624;
 border:1px solid #e14b70;
 color:#ffc0ce;
}

.success{
 background:#08264a;
 border:1px solid #087cff;
 color:#b9e7ff;
}

.access{
 text-align:center;
 margin-top:25px;
 color:#b9d2ed;
 font-size:12px;
 line-height:1.8;
}

.access strong{color:var(--cyan)}

.footer{
 margin-top:25px;
 text-align:center;
 color:#7e9cbe;
 font-size:11px;
 letter-spacing:1px;
}

@media(max-width:850px){
 .container{
  grid-template-columns:1fr;
  max-width:530px;
 }
 .brand-area{display:none}
}

@media(max-width:480px){
 body{padding:16px}
 .login-card{
  padding:27px 19px;
  border-radius:23px;
 }
 .card-brand h1{font-size:29px}
 .portal{font-size:18px}
 .input-box{height:59px}
 .submit{height:60px;font-size:17px}
}
</style>
</head>

<body>

<div class="wave"></div>

<main class="container">

<!-- LEFT BRAND SECTION -->

<section class="brand-area">

 <div class="brand">
  <img
   src="https://swiftpays.pages.dev/logo.png"
   alt="SwiftPays"
   class="brand-logo">

  <div class="brand-name">
   Swift<span>Pays</span>
  </div>
 </div>

 <div class="shield-area">
  <div class="orbit"></div>

  <div class="shield">
   <img
    src="https://swiftpays.pages.dev/logo.png"
    alt="SwiftPays Security">
  </div>
 </div>

 <div class="features">
  <div class="feature">📊 Analytics</div>
  <div class="feature">⚙️ Control</div>
  <div class="feature">👥 Admins</div>
  <div class="feature">🗄️ Database</div>
 </div>

 <div class="tagline">
  SECURE · MANAGE · CONTROL
 </div>

</section>


<!-- ADMIN LOGIN SECTION -->

<section class="login-card">

 <header class="card-brand">

  <img
   src="https://swiftpays.pages.dev/logo.png"
   alt="SwiftPays Logo"
   class="card-logo">

  <h1>Swift<span>Pays</span></h1>

  <div class="portal">
   👑 ADMIN PORTAL
  </div>

  <div class="subtitle">
   Secure Administration Console
  </div>

 </header>

 <div id="error" class="message error"></div>
 <div id="success" class="message success"></div>

 <form id="loginForm">

  <!-- EMAIL -->

  <div class="field">

   <label for="email">
    ✉️ EMAIL / ADMIN ID
   </label>

   <div class="input-box">

    <span class="input-icon">✉️</span>

    <input
     id="email"
     type="email"
     placeholder="Enter your admin email"
     autocomplete="username"
     required>

   </div>

  </div>


  <!-- PASSWORD -->

  <div class="field">

   <label for="password">
    🔐 PASSWORD
   </label>

   <div class="input-box">

    <span class="input-icon">🔐</span>

    <input
     id="password"
     type="password"
     placeholder="Enter your password"
     autocomplete="current-password"
     required>

    <button
     class="eye"
     type="button"
     id="eye">
     SHOW
    </button>

   </div>

  </div>


  <!-- REMEMBER ME -->

  <label class="remember">

   <input
    type="checkbox"
    id="remember"
    checked>

   🔒 Remember me for 24 hours

  </label>


  <!-- LOGIN BUTTON -->

  <button
   class="submit"
   id="submit"
   type="submit">

   🔐 &nbsp; SECURE LOGIN &nbsp; →

  </button>

 </form>


 <div class="access">
  🛡️ <strong>SwiftPays</strong> &nbsp; Admin Panel
  <br>
  Protected Owner/Admin Access
 </div>

 <div class="footer">
  SWIFTPAYS SECURITY · AUTHORIZED ACCESS ONLY
 </div>

</section>

</main>


<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
 apiKey:"AIzaSyA_KW4G3pdXu2VKTqa2-Sk9xE4hzDIWU9I",
 authDomain:"swiftpay-d0bd2.firebaseapp.com",
 projectId:"swiftpay-d0bd2",
 storageBucket:"swiftpay-d0bd2.firebasestorage.app",
 messagingSenderId:"83327557267",
 appId:"1:83327557267:web:a5605f47bc72ae4190f766"
};


const API_BASE =
 "https://swiftpay-api-6azu.onrender.com";

const SESSION_KEY =
 "swiftpays_admin_session_v1";

const DEVICE_KEY =
 "swiftpays_admin_device_v1";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);


// ERROR MESSAGE

function showError(message){

 $("success").style.display="none";

 $("error").textContent=message;

 $("error").style.display="block";
}


// SUCCESS MESSAGE

function showSuccess(message){

 $("error").style.display="none";

 $("success").textContent=message;

 $("success").style.display="block";
}


// DEVICE ID

function getDeviceId(){

 let id=localStorage.getItem(DEVICE_KEY);

 if(!id){

  id=crypto.randomUUID()+crypto.randomUUID();

  localStorage.setItem(DEVICE_KEY,id);
 }

 return id;
}


// SHOW / HIDE PASSWORD

$("eye").addEventListener("click",()=>{

 const field=$("password");

 const visible=field.type==="password";

 field.type=visible?"text":"password";

 $("eye").textContent=visible?"HIDE":"SHOW";

});


// ADMIN LOGIN

$("loginForm").addEventListener("submit",async event=>{

 event.preventDefault();

 $("error").style.display="none";

 $("success").style.display="none";

 const button=$("submit");

 button.disabled=true;

 button.textContent="🔄 VERIFYING ADMIN ACCESS...";


 try{

  // FIREBASE AUTHENTICATION

  const credential=await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );


  // FIREBASE TOKEN

  const firebaseToken=
   await credential.user.getIdToken(true);


  // BACKEND OWNER / ADMIN VERIFICATION

  const response=await fetch(
   `${API_BASE}/admin/login`,
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify({
     firebase_id_token:firebaseToken,
     device_id:getDeviceId()
    })
   }
  );


  const result=
   await response.json().catch(()=>({}));


  if(
   !response.ok ||
   result.authorized!==true ||
   !result.admin_session_token
  ){

   throw new Error(
    result.detail ||
    result.message ||
    "Admin authorization failed."
   );

  }


  // SAVE ADMIN SESSION

  const expiresAt=
   Date.parse(result.expires_at) ||
   Date.now()+86400000;


  localStorage.setItem(
   SESSION_KEY,
   JSON.stringify({
    token:result.admin_session_token,
    expiresAt:expiresAt,
    role:result.role,
    name:result.name || "Admin"
   })
  );


  sessionStorage.setItem(
   "swiftpays_admin_entry",
   "verified"
  );


  showSuccess(
   "🛡️ Admin verified. Opening dashboard..."
  );


  // REDIRECT

  location.replace("/admin/dashboard");


 }catch(error){

  await signOut(auth).catch(()=>{});

  localStorage.removeItem(SESSION_KEY);

  showError(
   error.message || "Login failed."
  );

  button.disabled=false;

  button.textContent="🔐 SECURE LOGIN →";

 }

});

</script>

</body>
</html>
