<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03171b">
<title>SwiftPays • Secure Admin Access</title>

<style>
:root{
 color-scheme:dark;
 --mint:#00e5ad;
 --muted:#9bb9bd;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:22px;
 background:
 radial-gradient(ellipse at 12% 12%,#06483f 0,transparent 34%),
 radial-gradient(ellipse at 95% 90%,#053b3b 0,transparent 32%),
 linear-gradient(135deg,#021216,#031d23 60%,#021318);
 font-family:Inter,system-ui,Arial,sans-serif;color:#f2fffc
}
.card{
 width:min(100%,510px);padding:38px 38px 30px;
 border:1px solid #00bca9;border-radius:30px;
 background:linear-gradient(145deg,rgba(5,39,44,.96),rgba(2,22,28,.98));
 box-shadow:0 25px 90px #0008,0 0 40px #00c7a51a;
 position:relative;overflow:hidden
}
.card:before{
 content:"";position:absolute;inset:0 0 auto;height:2px;
 background:linear-gradient(90deg,transparent,var(--mint),transparent)
}
.brand{
 display:flex;align-items:center;justify-content:center;
 gap:15px;margin-bottom:30px
}
.brand img{
 width:76px;height:76px;object-fit:contain;
 filter:drop-shadow(0 0 14px #00e5ad45)
}
.brand-title{font-size:34px;font-weight:850;letter-spacing:-1.5px}
.brand-title span{color:var(--mint)}
.brand-tag{
 display:inline-block;margin-top:5px;padding:5px 13px;
 border:1px solid #17645b;border-radius:30px;
 background:#0b3938;color:#9af5dc;
 font-size:10px;font-weight:900;letter-spacing:2px
}
.eyebrow{
 color:#65d9bd;font-size:10px;font-weight:900;
 letter-spacing:2.5px;text-align:center
}
.heading{text-align:center;font-size:31px;margin:8px 0}
.sub{
 text-align:center;color:var(--muted);
 font-size:14px;margin:0 0 27px
}
.field{margin:16px 0}
.field label{
 display:block;color:#c7e4df;font-size:12px;
 font-weight:750;margin:0 0 8px
}
.input-wrap{
 height:57px;display:flex;align-items:center;gap:12px;
 padding:0 15px;border:1px solid #18515a;
 border-radius:14px;background:#031b21;transition:.2s
}
.input-wrap:focus-within{
 border-color:var(--mint);box-shadow:0 0 0 3px #00e5ad17
}
.input-wrap .symbol{color:#80b8b5;font-size:17px}
.input-wrap input{
 width:100%;border:0;outline:0;background:transparent;
 color:white;font-size:15px;min-width:0
}
.input-wrap input::placeholder{color:#78969b}
.eye{
 border:0;background:transparent;color:#9bc6c5;
 padding:7px;display:grid;place-items:center;cursor:pointer
}
.eye svg{width:21px;height:21px}
.submit{
 width:100%;height:58px;margin-top:12px;
 border:1px solid #00edb5;border-radius:14px;
 background:linear-gradient(105deg,#00c895,#009e87);
 color:#fff;font-size:16px;font-weight:850;
 box-shadow:0 10px 28px #00c8952a;cursor:pointer
}
.submit:disabled{opacity:.65;cursor:wait}
.error{
 display:none;margin:14px 0;padding:11px 13px;
 border:1px solid #783b45;border-radius:11px;
 background:#321a22;color:#ffb4ba;font-size:12px
}
.secure{
 display:flex;justify-content:center;align-items:center;
 gap:9px;margin:20px 0 0;color:#b9d2d2;font-size:12px
}
.secure svg{width:18px;color:var(--mint)}
.footer{text-align:center;color:#6f999e;font-size:11px;margin-top:26px}
.footer b{color:#9edbd0}
.notice{text-align:center;color:#71949a;font-size:10px;margin-top:9px}
@media(max-width:520px){
 .card{padding:30px 21px 24px;border-radius:24px}
 .brand img{width:62px;height:62px}
 .brand-title{font-size:29px}
 .heading{font-size:27px}
}
</style>
</head>

<body>
<main class="card">

<div class="brand">
 <img src="https://swiftpays.pages.dev/logo.png" alt="SwiftPays logo">
 <div>
  <div class="brand-title">Swift<span>Pays</span></div>
  <div class="brand-tag">✦ ADMIN CONTROL CENTER</div>
 </div>
</div>

<div class="eyebrow">🌟 RESTRICTED ACCESS 🌟</div>
<h1 class="heading">Welcome Back</h1>
<p class="sub">Sign in securely to manage your SwiftPays platform.</p>

<div class="error" id="error" role="alert" aria-live="polite"></div>

<form id="loginForm">

<div class="field">
 <label for="email">ADMIN EMAIL</label>
 <div class="input-wrap">
  <span class="symbol">✉️</span>
  <input id="email" type="email"
   placeholder="Enter admin Gmail"
   autocomplete="username" required>
 </div>
</div>

<div class="field">
 <label for="password">PASSWORD</label>
 <div class="input-wrap">
  <span class="symbol">🔐</span>
  <input id="password" type="password"
   placeholder="Enter your password"
   autocomplete="current-password" required>

  <button class="eye" type="button" id="eye"
   aria-label="Show password">
   <svg viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="3"/>
   </svg>
  </button>
 </div>
</div>

<button class="submit" id="submit" type="submit">
 ✦ &nbsp; Secure Login
</button>

</form>

<div class="secure">
 <svg viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2">
  <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
  <path d="m9 12 2 2 4-4"/>
 </svg>
 Only verified Owner &amp; Admin accounts are permitted
</div>

<div class="footer">
 Protected by <b>SwiftPays Security</b> · 5-day login session
</div>

<div class="notice">
 Never share your admin password or login code.
</div>

</main>

<script type="module">

import{
 initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
 getAuth,
 signInWithEmailAndPassword,
 signOut,
 setPersistence,
 browserLocalPersistence
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig={
 apiKey:"AIzaSyA_KW4G3pdXu2VKTqa2-Sk9xE4hzDIWU9I",
 authDomain:"swiftpay-d0bd2.firebaseapp.com",
 projectId:"swiftpay-d0bd2",
 storageBucket:"swiftpay-d0bd2.firebasestorage.app",
 messagingSenderId:"83327557267",
 appId:"1:83327557267:web:a5605f47bc72ae4190f766"
};


/* CONFIGURATION */

const auth=getAuth(initializeApp(firebaseConfig));

const API="https://swiftpay-api-6azu.onrender.com";

const SESSION_KEY="swiftpays_admin_session_v1";
const DEVICE_KEY="swiftpays_admin_device_v1";

const DASHBOARD="/admin-dashboard.html";

const $=id=>document.getElementById(id);


/* ERROR MESSAGE */

function showError(msg){
 $("error").textContent=msg;
 $("error").style.display="block";
}


/* DEVICE ID */

function deviceId(){

 let id=localStorage.getItem(DEVICE_KEY);

 if(!id){

  id=(crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`)
    +(crypto.randomUUID?.()||"");

  localStorage.setItem(DEVICE_KEY,id);
 }

 return id;
}


/* SESSION VALIDATION - CLIENT EXPIRY CHECK */

function getSession(){

 try{

  const s=JSON.parse(
   localStorage.getItem(SESSION_KEY)||"null"
  );

  if(
   !s?.token||
   !Number.isFinite(s.expiresAt)||
   s.expiresAt<=Date.now()
  ){

   localStorage.removeItem(SESSION_KEY);
   return null;
  }

  return s;

 }catch{

  localStorage.removeItem(SESSION_KEY);
  return null;
 }

}


/* EXISTING SESSION - DIRECT DASHBOARD */

if(getSession()){
 location.replace(DASHBOARD);
}


/* PASSWORD SHOW/HIDE */

$("eye").addEventListener("click",()=>{

 const p=$("password");

 p.type=p.type==="password"?"text":"password";

 $("eye").setAttribute(
  "aria-label",
  p.type==="password"?"Show password":"Hide password"
 );

});


/* LOGIN PROCESS */

$("loginForm").addEventListener("submit",async e=>{

 e.preventDefault();

 $("error").style.display="none";

 const btn=$("submit");

 btn.disabled=true;
 btn.textContent="Checking credentials…";

 try{

  await setPersistence(auth,browserLocalPersistence);

  const cred=await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  btn.textContent="Verifying admin access…";

  // Avoid unnecessary forced token refresh.
  const idToken=await cred.user.getIdToken();

  const controller=new AbortController();

  const timer=setTimeout(
   ()=>controller.abort(),
   25000
  );

  let response;

  try{

   response=await fetch(API+"/admin/login",{

    method:"POST",

    headers:{
     "Content-Type":"application/json"
    },

    body:JSON.stringify({

     firebase_id_token:idToken,
     device_id:deviceId()

    }),

    signal:controller.signal,
    cache:"no-store"

   });

  }finally{

   clearTimeout(timer);

  }


  const data=await response.json().catch(()=>({}));

  if(
   !response.ok||
   data.authorized!==true||
   !data.admin_session_token
  ){

   throw new Error(
    data.detail||"This account is not authorized."
   );

  }


  // Backend expiry is authoritative.
  const expiresAt=data.expires_at
   ?Date.parse(data.expires_at)
   :NaN;

  if(
   !Number.isFinite(expiresAt)||
   expiresAt<=Date.now()
  ){

   throw new Error(
    "Backend did not return a valid admin session expiry."
   );

  }


  /* SAVE ADMIN SESSION */

  localStorage.setItem(
   SESSION_KEY,
   JSON.stringify({

    token:data.admin_session_token,
    expiresAt:expiresAt

   })
  );


  btn.textContent="Verified. Opening dashboard…";

  location.replace(DASHBOARD);


 }catch(err){

  await signOut(auth).catch(()=>{});

  localStorage.removeItem(SESSION_KEY);

  if(err.name==="AbortError"){

   showError(
    "Server verification timed out. The backend may be waking up. Please try again."
   );

  }else if([
   "auth/invalid-credential",
   "auth/wrong-password",
   "auth/user-not-found"
  ].includes(err.code)){

   showError("Incorrect admin email or password.");

  }else if(err.code==="auth/too-many-requests"){

   showError("Too many attempts. Please wait and try again.");

  }else{

   showError(
    err.message||"Login failed. Please try again."
   );

  }

  btn.disabled=false;
  btn.textContent="✦  Secure Login";

 }

});

</script>
</body>
</html>
