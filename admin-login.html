
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03171b">
<title>SwiftPays | Secure Admin Login</title>

<style>
:root{
 --mint:#00e5ad;
 --bg:#03171b;
 --muted:#9bb9bd;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:22px;
 background:
 radial-gradient(ellipse at 12% 12%,#06483f,transparent 34%),
 radial-gradient(ellipse at 95% 90%,#053b3b,transparent 32%),
 linear-gradient(135deg,#021216,#031d23 60%,#021318);
 font-family:Inter,system-ui,Arial,sans-serif;
 color:#f2fffc;
}
.card{
 width:min(100%,510px);
 padding:38px 38px 30px;
 border:1px solid #00bca9;
 border-radius:30px;
 background:linear-gradient(145deg,#05272c,#02161c);
 box-shadow:0 25px 90px #0008,0 0 40px #00c7a51a;
 position:relative;
 overflow:hidden;
}
.card:before{
 content:"";
 position:absolute;
 inset:0 0 auto;
 height:2px;
 background:linear-gradient(90deg,transparent,var(--mint),transparent);
}
.brand{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:15px;
 margin-bottom:30px;
}
.brand img{
 width:76px;
 height:76px;
 object-fit:contain;
}
.brand-title{
 font-size:34px;
 font-weight:850;
 letter-spacing:-1.5px;
}
.brand-title span{color:var(--mint)}
.brand-tag{
 display:inline-block;
 margin-top:5px;
 padding:5px 13px;
 border:1px solid #17645b;
 border-radius:30px;
 background:#0b3938;
 color:#9af5dc;
 font-size:10px;
 font-weight:900;
 letter-spacing:2px;
}
.eyebrow{
 color:#65d9bd;
 font-size:10px;
 font-weight:900;
 letter-spacing:2.5px;
 text-align:center;
}
.heading{
 text-align:center;
 font-size:31px;
 margin:8px 0;
}
.sub{
 text-align:center;
 color:var(--muted);
 font-size:14px;
 margin:0 0 27px;
}
.field{margin:16px 0}
.field label{
 display:block;
 color:#c7e4df;
 font-size:12px;
 font-weight:750;
 margin-bottom:8px;
}
.input-wrap{
 height:57px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 15px;
 border:1px solid #18515a;
 border-radius:14px;
 background:#031b21;
}
.input-wrap:focus-within{
 border-color:var(--mint);
 box-shadow:0 0 0 3px #00e5ad17;
}
.input-wrap input{
 width:100%;
 border:0;
 outline:0;
 background:transparent;
 color:white;
 font-size:15px;
 min-width:0;
}
.input-wrap input::placeholder{color:#78969b}
.symbol{color:#80b8b5}
.eye{
 border:0;
 background:transparent;
 color:#9bc6c5;
 padding:7px;
 cursor:pointer;
}
.eye svg{width:21px;height:21px}
.submit{
 width:100%;
 height:58px;
 margin-top:12px;
 border:1px solid #00edb5;
 border-radius:14px;
 background:linear-gradient(105deg,#00c895,#009e87);
 color:white;
 font-size:16px;
 font-weight:850;
 cursor:pointer;
}
.submit:disabled{opacity:.65;cursor:wait}
.error{
 display:none;
 margin:14px 0;
 padding:12px 13px;
 border:1px solid #783b45;
 border-radius:11px;
 background:#321a22;
 color:#ffb4ba;
 font-size:12px;
 overflow-wrap:anywhere;
 white-space:pre-wrap;
}
.success{
 display:none;
 margin:14px 0;
 padding:12px;
 border:1px solid #14775c;
 border-radius:11px;
 background:#083b30;
 color:#9bffdb;
 font-size:12px;
}
.secure{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:9px;
 margin:20px 0 0;
 color:#b9d2d2;
 font-size:12px;
 text-align:center;
}
.footer{
 text-align:center;
 color:#6f999e;
 font-size:11px;
 margin-top:26px;
}
.footer b{color:#9edbd0}
.notice{
 text-align:center;
 color:#71949a;
 font-size:10px;
 margin-top:9px;
}
@media(max-width:520px){
 .card{padding:30px 21px 24px;border-radius:24px}
 .brand img{width:62px;height:62px}
 .brand-title{font-size:29px}
 .heading{font-size:27px}
}
</style>
</head>

<body>
<main class="card">

 <div class="brand">
  <img src="https://swiftpays.pages.dev/logo.png" alt="SwiftPays">
  <div>
   <div class="brand-title">Swift<span>Pays</span></div>
   <div class="brand-tag">✦ ADMIN CONTROL CENTER</div>
  </div>
 </div>

 <div class="eyebrow">🌟 RESTRICTED ACCESS 🌟</div>
 <h1 class="heading">Welcome Back</h1>
 <p class="sub">Sign in securely to manage your SwiftPays platform.</p>

 <div class="error" id="error" role="alert"></div>
 <div class="success" id="success"></div>

 <form id="loginForm" novalidate>

  <div class="field">
   <label for="email">ADMIN EMAIL</label>
   <div class="input-wrap">
    <span class="symbol">✉️</span>
    <input
     id="email"
     type="email"
     placeholder="Enter admin email"
     autocomplete="username"
     required
    >
   </div>
  </div>

  <div class="field">
   <label for="password">PASSWORD</label>
   <div class="input-wrap">
    <span class="symbol">🔐</span>
    <input
     id="password"
     type="password"
     placeholder="Enter your password"
     autocomplete="current-password"
     required
    >
    <button class="eye" type="button" id="eye" aria-label="Show password">
     <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
     </svg>
    </button>
   </div>
  </div>

  <button class="submit" id="submit" type="submit">
   ✦ Secure Login
  </button>

 </form>

 <div class="secure">
  🛡️ Only verified Owner & Admin accounts are permitted
 </div>

 <div class="footer">
  Protected by <b>SwiftPays Security</b>
 </div>

 <div class="notice">
  Never share your admin password or login code.
 </div>

</main>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 setPersistence,
 browserLocalPersistence,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
 apiKey:"AIzaSyA_KW4G3pdXu2VKTqa2-Sk9xE4hzDIWU9I",
 authDomain:"swiftpay-d0bd2.firebaseapp.com",
 projectId:"swiftpay-d0bd2",
 storageBucket:"swiftpay-d0bd2.firebasestorage.app",
 messagingSenderId:"83327557267",
 appId:"1:83327557267:web:a5605f47bc72ae4190f766"
};


/* BACKEND CONFIG */

const API = "https://swiftpay-api-6azu.onrender.com";


/* INITIALIZATION */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);


/* ERROR FORMATTER */

function getErrorMessage(data,status){

 if(data && Array.isArray(data.detail)){

  return data.detail.map(item=>{

   const field = Array.isArray(item.loc)
    ? item.loc.join(" → ")
    : "Request";

   return field + ": " + (item.msg || "Field required");

  }).join("\n");
 }

 if(data && typeof data.detail === "string"){
  return data.detail;
 }

 if(data && typeof data.message === "string"){
  return data.message;
 }

 if(data && typeof data.error === "string"){
  return data.error;
 }

 return "Request failed. HTTP " + status;
}


/* MESSAGE FUNCTIONS */

function showError(message){

 const box = $("error");

 box.textContent = message;
 box.style.display = "block";

 $("success").style.display = "none";
}

function showSuccess(message){

 const box = $("success");

 box.textContent = message;
 box.style.display = "block";

 $("error").style.display = "none";
}


/* PASSWORD VISIBILITY */

$("eye").addEventListener("click",()=>{

 const password = $("password");

 password.type =
  password.type === "password" ? "text" : "password";

 $("eye").setAttribute(
  "aria-label",
  password.type === "password"
   ? "Show password"
   : "Hide password"
 );

});


/* LOGIN PROCESS */

$("loginForm").addEventListener("submit",async event=>{

 event.preventDefault();

 $("error").style.display = "none";
 $("success").style.display = "none";

 const email = $("email").value.trim();
 const password = $("password").value;

 const button = $("submit");

 if(!email || !password){

  showError("Please enter your email and password.");
  return;

 }

 button.disabled = true;
 button.textContent = "Verifying secure access…";

 try{

  /*
   * STEP 1: FIREBASE PERSISTENCE
   */

  await setPersistence(auth,browserLocalPersistence);


  /*
   * STEP 2: FIREBASE LOGIN
   */

  const credential = await signInWithEmailAndPassword(
   auth,
   email,
   password
  );


  /*
   * STEP 3: FIREBASE ID TOKEN
   */

  const idToken = await credential.user.getIdToken(true);

  if(!idToken || idToken.length < 20){

   throw new Error("Could not generate Firebase authentication token.");

  }


  /*
   * STEP 4: BACKEND OWNER / ADMIN VERIFICATION
   */

  const response = await fetch(API + "/admin/login",{

   method:"POST",

   headers:{
    "Content-Type":"application/json"
   },

   body:JSON.stringify({
    firebase_id_token:idToken
   })

  });


  /*
   * STEP 5: READ BACKEND RESPONSE
   */

  const data = await response.json().catch(()=>({

   message:"Backend returned an invalid JSON response."

  }));


  /*
   * STEP 6: HANDLE API ERRORS
   */

  if(!response.ok){

   throw new Error(
    getErrorMessage(data,response.status)
   );

  }


  if(data.authorized !== true){

   throw new Error(
    getErrorMessage(data,response.status)
   );

  }


  /*
   * STEP 7: STORE VERIFIED ENTRY MARKER
   */

  sessionStorage.setItem(
   "swiftpays_admin_entry",
   "verified"
  );


  /*
   * STEP 8: SAVE ROLE
   */

  sessionStorage.setItem(
   "swiftpays_admin_role",
   data.role || "admin"
  );


  /*
   * STEP 9: OPEN DASHBOARD
   */

  showSuccess("Authentication successful. Opening dashboard…");

  button.textContent = "Access Granted";

  setTimeout(()=>{

   location.replace("/admin/dashboard");

  },500);


 }catch(error){

  /*
   * DO NOT DISPLAY [object Object]
   */

  const message =
   error instanceof Error
    ? error.message
    : String(error);


  /*
   * Sign out only after an actual login/authorization failure.
   */

  await signOut(auth).catch(()=>{});

  sessionStorage.removeItem("swiftpays_admin_entry");
  sessionStorage.removeItem("swiftpays_admin_role");

  showError(message);

  button.disabled = false;
  button.textContent = "✦ Secure Login";

 }

});

</script>
</body>
</html>
