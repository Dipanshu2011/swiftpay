
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030b1c">

    <title>SwiftPays | Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #063b70, transparent 50%),
                #030b1c;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid #087fff;
            border-radius: 25px;
            background: #081a34;
            box-shadow: 0 0 35px #008cff30;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 25px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #00cfff80);
        }

        h1 {
            font-size: 27px;
            margin-bottom: 12px;
        }

        h1 span {
            color: #20d9ff;
        }

        p {
            color: #a9c2e5;
            font-size: 14px;
            line-height: 1.6;
        }

        .loader {
            width: 35px;
            height: 35px;
            margin: 25px auto 15px;
            border: 3px solid #16446e;
            border-top-color: #20d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            color: #20d9ff;
            font-size: 13px;
        }

        .fallback {
            display: none;
            margin-top: 20px;
            color: #a9c2e5;
            font-size: 13px;
        }

        .fallback a {
            color: #20d9ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="card">

        <img
            src="/logo.png"
            alt="SwiftPays Logo"
            class="logo"
        >

        <h1>Welcome to <span>SwiftPays</span></h1>

        <p>
            💎 Premium Secure Payment Gateway<br>
            Redirecting you to your registration page.
        </p>

        <div class="loader"></div>

        <div class="status">
            ✨ Opening Registration...
        </div>

        <div class="fallback" id="fallback">
            Not redirected?
            <a href="/register.html">Register Now</a>
        </div>

    </main>

    <script>
        (() => {
            "use strict";

            const REGISTER_URL = "/register.html";

            // Direct registration redirect
            window.location.replace(REGISTER_URL);

            // Fallback if redirect does not happen
            setTimeout(() => {
                document.getElementById("fallback").style.display = "block";
            }, 3000);

        })();
    </script>

</body>
</html>
