
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071326">

<title>SwiftPays | Security Verification</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at top, #173b70 0%, transparent 48%),
        linear-gradient(145deg, #040b19, #0a1930, #080e20);
}

.container {
    width: 100%;
    max-width: 510px;
    padding: 38px 25px;
    text-align: center;
    border-radius: 27px;
    background: linear-gradient(145deg, #0d1c34, #10142b);
    border: 2px solid transparent;
    background-clip: padding-box;
    position: relative;
    box-shadow: 0 20px 65px #0009;
}

.container::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 28px;
    padding: 2px;
    background: linear-gradient(130deg, #238cff, #22d3ee, #9a50ef);
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

.logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 35px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(135deg, #2468f2, #21c5e8);
    box-shadow: 0 5px 22px #168bff55;
    font-size: 25px;
}

.logo-text {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo-text span {
    color: #29b9ef;
}

.security-icon {
    width: 82px;
    height: 82px;
    margin: 0 auto 23px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    font-size: 39px;
    background: linear-gradient(135deg, #285be9, #20bce0);
    box-shadow: 0 10px 30px #168bff44;
}

h1 {
    font-size: 29px;
    font-weight: 850;
    margin-bottom: 13px;
}

.description {
    color: #a6b7d0;
    font-size: 14px;
    line-height: 1.7;
    max-width: 380px;
    margin: 0 auto 28px;
}

.security-label {
    color: #35c7ee;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 13px;
}

.captcha-box {
    width: 100%;
    min-height: 78px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
}

#turnstile-box {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60px;
    width: 100%;
}

.verify-btn {
    width: 100%;
    min-height: 62px;
    margin-top: 24px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(100deg, #2859eb, #21bde1);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 9px 24px #137ee944;
    transition: .2s;
}

.verify-btn:disabled {
    opacity: .48;
    cursor: not-allowed;
}

.verify-btn:not(:disabled):active {
    transform: scale(.98);
}

.status {
    min-height: 23px;
    margin-top: 17px;
    font-size: 13px;
    color: #a5b5cf;
    line-height: 1.5;
}

.status.error {
    color: #ff8585;
}

.status.success {
    color: #35e6a4;
}

.footer {
    border-top: 1px solid #ffffff15;
    margin-top: 29px;
    padding-top: 21px;
    color: #788da9;
    font-size: 11px;
    line-height: 1.8;
}

.footer strong {
    display: block;
    color: #32bce9;
    font-size: 14px;
    letter-spacing: 2px;
    margin-top: 5px;
}

@media(max-width: 420px) {
    .container {
        padding: 32px 17px;
    }

    h1 {
        font-size: 25px;
    }

    .logo-text {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- SWIFTPAYS LOGO -->
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
            SWIFT<span>PAYS</span>
        </div>
    </div>

    <!-- SECURITY ICON -->
    <div class="security-icon">🛡️</div>

    <h1>Security Verification</h1>

    <p class="description">
        Welcome to SwiftPays! Please complete the
        security verification below to continue
        creating your account.
    </p>

    <div class="security-label">
        HUMAN VERIFICATION
    </div>

    <!-- CLOUDFLARE TURNSTILE -->
    <div class="captcha-box">
        <div id="turnstile-box"></div>
    </div>

    <button
        class="verify-btn"
        id="continueBtn"
        disabled
        type="button"
    >
        Verify & Continue →
    </button>

    <div class="status" id="status">
        Loading security verification...
    </div>

    <div class="footer">
        Protected by Cloudflare Security
        <strong>SWIFTPAYS</strong>
        © 2026 SwiftPays. All rights reserved.
    </div>

</main>

<script>
const API_BASE =
    "https://swiftpay-api-6azu.onrender.com";

const statusBox =
    document.getElementById("status");

const continueBtn =
    document.getElementById("continueBtn");

let siteKey = "";
let widgetId = null;
let verificationToken = "";

function status(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

async function loadConfig() {
    try {
        const response = await fetch(
            API_BASE + "/public/config",
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(
                "Could not load security settings."
            );
        }

        const config = await response.json();

        if (config.turnstile_enabled === false) {
            throw new Error(
                "Security verification is currently disabled."
            );
        }

        siteKey = String(
            config.turnstile_site_key || ""
        ).trim();

        if (!siteKey) {
            throw new Error(
                "Cloudflare Site Key is missing."
            );
        }

        waitForTurnstile();

    } catch (error) {
        status(error.message, "error");
    }
}

function waitForTurnstile() {

    if (!window.turnstile) {
        setTimeout(waitForTurnstile, 300);
        return;
    }

    try {
        widgetId = turnstile.render(
            "#turnstile-box",
            {
                sitekey: siteKey,
                theme: "light",
                callback: function(token) {

                    verificationToken = token;

                    continueBtn.disabled = false;

                    status(
                        "✓ Human verification completed.",
                        "success"
                    );
                },

                "expired-callback": function() {

                    verificationToken = "";
                    continueBtn.disabled = true;

                    status(
                        "Verification expired. Please try again."
                    );
                },

                "error-callback": function() {

                    verificationToken = "";
                    continueBtn.disabled = true;

                    status(
                        "Verification error. Refresh the page.",
                        "error"
                    );
                }
            }
        );

        status(
            "Please complete the Cloudflare verification."
        );

    } catch (error) {
        status(
            "Unable to load Cloudflare verification.",
            "error"
        );
    }
}

continueBtn.addEventListener("click", async function() {

    if (!verificationToken) {
        status(
            "Please complete verification first.",
            "error"
        );
        return;
    }

    continueBtn.disabled = true;
    continueBtn.textContent = "Verifying...";

    status("Checking your security verification...");

    try {
        const response = await fetch(
            API_BASE + "/verify-turnstile",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    token: verificationToken
                })
            }
        );

        const result = await response.json();

        if (!response.ok || result.success !== true) {
            throw new Error(
                result.detail ||
                "Security verification failed."
            );
        }

        sessionStorage.setItem(
            "swiftpays_entry_verified",
            "1"
        );

        status(
            "✓ Verification successful! Redirecting...",
            "success"
        );

        setTimeout(function() {
            window.location.replace("/register");
        }, 500);

    } catch (error) {

        verificationToken = "";

        continueBtn.textContent =
            "Verify & Continue →";

        if (
            widgetId !== null &&
            window.turnstile
        ) {
            turnstile.reset(widgetId);
        }

        status(
            error.message || "Please try again.",
            "error"
        );
    }
});

window.addEventListener("load", loadConfig);
</script>

</body>
</html>
