

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05091e">

<title>SwiftPays - Device Verification</title>

<link rel="preconnect" href="https://challenges.cloudflare.com">
<link rel="preconnect" href="https://swiftpay-api-6azu.onrender.com">
<link rel="preconnect" href="https://swiftpays.pages.dev">

<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
  defer>
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, Arial, sans-serif;
    color: #fff;
    background:
        radial-gradient(ellipse at 10% 50%, #10105b55, transparent 45%),
        radial-gradient(ellipse at 90% 50%, #063c7655, transparent 45%),
        #030719;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 760px;
    padding: 35px 28px 30px;
    text-align: center;
    border: 2px solid transparent;
    border-radius: 38px;
    background:
        linear-gradient(145deg, #050d2c, #080b27) padding-box,
        linear-gradient(130deg, #00d9ff, #6545ff, #c02aff, #00d9ff) border-box;
    box-shadow:
        0 0 20px #00cfff44,
        0 0 55px #762cff33,
        inset 0 0 35px #172d6b22;
    position: relative;
}

.logo {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

.logo img {
    width: 235px;
    height: 85px;
    max-width: 85%;
    object-fit: contain;
}

.scan-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.scan-icon svg {
    width: 100px;
    height: 100px;
    filter: drop-shadow(0 0 12px #00bfff);
    animation: pulse 2s ease-in-out infinite;
}

.scan-ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    border-top-color: #00d9ff;
    border-right-color: #7b45ff;
    animation: spin 2.5s linear infinite;
}

.scan-ring::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid #1b8cff77;
    border-radius: 50%;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: .75;
        transform: scale(.94);
    }
}

h1 {
    font-size: clamp(27px, 5vw, 39px);
    font-weight: 850;
    margin-bottom: 15px;
    text-shadow: 0 0 20px #238cff55;
}

.description {
    color: #bdc9e8;
    font-size: 16px;
    line-height: 1.7;
    max-width: 570px;
    margin: 0 auto 35px;
}

.progress {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    max-width: 550px;
    margin: 0 auto 40px;
    position: relative;
}

.progress-line {
    position: absolute;
    height: 4px;
    left: 16%;
    right: 16%;
    top: 15px;
    background: #28315e;
    z-index: 0;
}

.progress-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #00d9ff, #9b43ff);
    transition: width .35s ease;
}

.step {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 12px;
    color: #8794b9;
    font-size: 14px;
    font-weight: 600;
}

.circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #090e2b;
    border: 3px solid #5740c7;
    display: grid;
    place-items: center;
    color: white;
}

.step.active .circle,
.step.done .circle {
    background: #13caff;
    border-color: #fff;
    box-shadow: 0 0 15px #00cfff;
    color: #07142c;
}

.step.active {
    color: #fff;
}

.cloudflare-box {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 17px 20px;
    border: 2px solid transparent;
    border-radius: 20px;
    background:
        linear-gradient(120deg, #10224b, #10132d) padding-box,
        linear-gradient(110deg, #00d9ff, #9a42ff) border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    box-shadow: 0 0 22px #007bff22;
}

.protected {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    font-weight: 600;
    color: #e5edff;
}

.protected svg {
    width: 30px;
    height: 30px;
    color: #4acbff;
}

.separator {
    width: 1px;
    height: 35px;
    background: #45608e;
}

.cf-logo {
    text-align: center;
    color: #fff;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 1px;
}

.cf-cloud {
    color: #ff922e;
    font-size: 27px;
    line-height: 1;
}

.status {
    min-height: 25px;
    margin: 25px 0 18px;
    color: #aebde0;
    font-size: 14px;
    line-height: 1.6;
}

.status.success {
    color: #37e8ad;
}

.status.error {
    color: #ff8989;
}

.retry {
    display: none;
    padding: 13px 32px;
    margin: 5px auto 20px;
    border: 1px solid #16c9ff;
    border-radius: 30px;
    background: linear-gradient(100deg, #0758b9, #7029d7);
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
}

.features {
    border-top: 1px solid #ffffff20;
    margin-top: 30px;
    padding-top: 24px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 14px;
}

.feature {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #c8d8f7;
    font-size: 13px;
}

.feature-icon {
    color: #22caff;
    font-size: 20px;
}

.footer {
    color: #9caed2;
    font-size: 13px;
    margin-top: 25px;
}

#turnstile-box {
    position: fixed;
    left: -10000px;
    top: 0;
}

@media(max-width: 520px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 30px 16px 25px;
        border-radius: 28px;
    }

    .logo img {
        width: 205px;
        height: 75px;
    }

    .scan-icon {
        width: 105px;
        height: 105px;
    }

    .scan-icon svg {
        width: 85px;
        height: 85px;
    }

    .description {
        font-size: 14px;
    }

    .step {
        font-size: 12px;
    }

    .cloudflare-box {
        padding: 14px 9px;
        gap: 9px;
    }

    .protected {
        font-size: 12px;
    }

    .cf-logo {
        font-size: 10px;
    }

    .features {
        gap: 12px;
    }

    .feature {
        font-size: 11px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- OFFICIAL SWIFTPAYS LOGO -->
    <div class="logo">
        <img
            src="https://swiftpays.pages.dev/logo.png"
            alt="SwiftPays Payment Gateway"
            fetchpriority="high"
        >
    </div>

    <!-- FINGERPRINT SCANNER -->
    <div class="scan-icon">

        <div class="scan-ring"></div>

        <svg viewBox="0 0 100 100" fill="none"
             stroke="url(#fingerGradient)"
             stroke-width="3.2"
             stroke-linecap="round">

            <defs>
                <linearGradient id="fingerGradient"
                    x1="10" y1="10" x2="90" y2="90">
                    <stop stop-color="#00E5FF"/>
                    <stop offset="1" stop-color="#A64CFF"/>
                </linearGradient>
            </defs>

            <path d="M50 13 C28 13 16 29 16 49"/>
            <path d="M50 23 C34 23 25 35 25 51"/>
            <path d="M50 33 C40 33 35 41 35 52"/>
            <path d="M50 13 C72 13 84 29 84 49"/>
            <path d="M50 23 C66 23 75 35 75 51"/>
            <path d="M50 33 C60 33 65 41 65 52"/>
            <path d="M50 42 C50 42 50 64 39 79"/>
            <path d="M50 42 C50 42 50 71 50 84"/>
            <path d="M50 42 C50 42 50 64 61 79"/>
            <path d="M25 57 C25 68 21 75 16 81"/>
            <path d="M75 57 C75 68 79 75 84 81"/>

        </svg>
    </div>

    <h1>Verifying Your Device</h1>

    <p class="description">
        Please wait while we verify your browser
        for secure access to SwiftPays.
    </p>

    <!-- THREE STEP PROGRESS -->
    <div class="progress">

        <div class="progress-line">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="step done" id="step1">
            <div class="circle">✓</div>
            <span>Connecting</span>
        </div>

        <div class="step active" id="step2">
            <div class="circle">2</div>
            <span>Verifying</span>
        </div>

        <div class="step" id="step3">
            <div class="circle">3</div>
            <span>Redirecting</span>
        </div>

    </div>

    <!-- CLOUDFLARE PROTECTION -->
    <div class="cloudflare-box">

        <div class="protected">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <path d="M12 2 21 6v6c0 5-4 9-9 11-5-2-9-6-9-11V6z"/>
                <path d="m8 12 3 3 5-6"/>
            </svg>
            <span>Protected by Cloudflare</span>
        </div>

        <div class="separator"></div>

        <div class="cf-logo">
            <div class="cf-cloud">☁</div>
            CLOUDFLARE
        </div>

    </div>

    <div class="status" id="status">
        Connecting to security service...
    </div>

    <button class="retry" id="retryBtn" type="button">
        ↻ Try Again
    </button>

    <!-- SECURITY FEATURES -->
    <div class="features">

        <div class="feature">
            <span class="feature-icon">♢</span>
            Secure Signup
        </div>

        <div class="feature">
            <span class="feature-icon">ϟ</span>
            Protected Account
        </div>

        <div class="feature">
            <span class="feature-icon">▣</span>
            Fast Access
        </div>

    </div>

    <div class="footer">
        © 2026 SwiftPays. All rights reserved.
    </div>

</main>

<!-- REAL CLOUDFLARE WIDGET -->
<div id="turnstile-box"></div>

<script>
(() => {
    "use strict";

    const API =
        "https://swiftpay-api-6azu.onrender.com";

    const statusEl =
        document.getElementById("status");

    const retryBtn =
        document.getElementById("retryBtn");

    const progressFill =
        document.getElementById("progressFill");

    const steps = [
        document.getElementById("step1"),
        document.getElementById("step2"),
        document.getElementById("step3")
    ];

    let siteKey = "";
    let widgetId = null;
    let completed = false;
    let rendering = false;
    let attempts = 0;

    function setStatus(text, type = "") {
        statusEl.textContent = text;
        statusEl.className = "status " + type;
    }

    function setStep(number) {
        steps.forEach((step, index) => {
            step.classList.remove("active", "done");

            if (index < number - 1) {
                step.classList.add("done");
                step.querySelector(".circle").textContent = "✓";
            } else if (index === number - 1) {
                step.classList.add("active");
                step.querySelector(".circle").textContent =
                    String(index + 1);
            }
        });

        progressFill.style.width =
            number === 1 ? "0%" :
            number === 2 ? "50%" : "100%";
    }

    function showFailure(message) {
        completed = false;
        rendering = false;

        setStatus(message, "error");

        retryBtn.style.display = "block";
    }

    async function verifyToken(token) {
        if (completed) return;

        setStatus("Validating your security verification...");
        retryBtn.style.display = "none";

        try {
            const response = await fetch(
                API + "/verify-turnstile",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || result.success !== true) {
                throw new Error(
                    result.detail || "Verification failed."
                );
            }

            completed = true;

            setStep(3);

            setStatus(
                "✓ Security verified! Redirecting to registration...",
                "success"
            );

            document.querySelector("h1").textContent =
                "Security Check Passed";

            setTimeout(() => {
                window.location.replace("/register");
            }, 650);

        } catch (error) {
            showFailure(
                error.message || "Verification failed. Please retry."
            );
        }
    }

    async function loadConfig() {
        setStep(1);
        setStatus("Connecting to security service...");

        try {
            const response = await fetch(
                API + "/public/config",
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Security service is unavailable."
                );
            }

            const config = await response.json();

            if (config.turnstile_enabled === false) {
                throw new Error(
                    "Cloudflare verification is disabled."
                );
            }

            siteKey = String(
                config.turnstile_site_key || ""
            ).trim();

            if (!siteKey) {
                throw new Error(
                    "Cloudflare Site Key is not configured."
                );
            }

            setStep(2);
            setStatus("Verifying your browser...");

            startTurnstile();

        } catch (error) {
            showFailure(error.message);
        }
    }

    function startTurnstile() {
        if (rendering || completed) return;

        if (!window.turnstile) {
            setTimeout(startTurnstile, 150);
            return;
        }

        rendering = true;
        retryBtn.style.display = "none";

        try {
            if (widgetId !== null) {
                turnstile.remove(widgetId);
                widgetId = null;
            }

            widgetId = turnstile.render(
                "#turnstile-box",
                {
                    sitekey: siteKey,
                    size: "invisible",
                    execution: "render",

                    callback: function(token) {
                        rendering = false;
                        verifyToken(token);
                    },

                    "expired-callback": function() {
                        rendering = false;

                        if (!completed) {
                            showFailure(
                                "Verification expired. Please try again."
                            );
                        }
                    },

                    "error-callback": function() {
                        rendering = false;

                        if (!completed) {
                            showFailure(
                                "Cloudflare verification error."
                            );
                        }
                    }
                }
            );

            attempts++;

        } catch (error) {
            rendering = false;

            showFailure(
                "Unable to start Cloudflare verification."
            );
        }
    }

    retryBtn.addEventListener("click", function() {
        retryBtn.style.display = "none";
        setStatus("Restarting security verification...");

        if (widgetId !== null && window.turnstile) {
            try {
                turnstile.reset(widgetId);
                rendering = true;
            } catch (error) {
                rendering = false;
                startTurnstile();
            }
        } else {
            startTurnstile();
        }
    });

    loadConfig();

})();
</script>

</body>
</html>
