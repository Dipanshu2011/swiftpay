
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030817">
<title>Create Security PIN | SwiftPays</title>

<style>
:root {
  --cyan: #08d9ed;
  --blue: #0875ff;
  --bg: #030817;
  --muted: #a9b9d2;
  --border: #287acb;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 5% 5%, #0875ff35, transparent 35%),
    radial-gradient(circle at 95% 95%, #00d9ed25, transparent 35%),
    var(--bg);
}

.card {
  width: 100%;
  max-width: 550px;
  padding: 32px 25px;
  border: 1.5px solid #168bff;
  border-radius: 28px;
  background: linear-gradient(145deg, #07172f, #040b1b);
  box-shadow: 0 0 35px #087dff35;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  background: #087dff12;
  filter: blur(60px);
  top: -100px;
  left: -80px;
  pointer-events: none;
}

/* TOP BRAND LOGO */

.brand {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 22px;
  position: relative;
  z-index: 1;
}

.brand img {
  width: 190px;
  max-width: 75%;
  height: 65px;
  object-fit: contain;
}

/* MAIN LOGO - REPLACES SHIELD */

.security-logo {
  width: 180px;
  height: 150px;
  object-fit: contain;
  display: block;
  margin: 0 auto 25px;
  filter: drop-shadow(0 0 18px #087dff55);
}

h1 {
  text-align: center;
  font-size: clamp(25px, 6vw, 34px);
  line-height: 1.3;
  margin-bottom: 12px;
}

h1 span {
  color: var(--cyan);
}

.subtitle {
  max-width: 390px;
  margin: 0 auto 30px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.65;
}

label {
  display: block;
  margin: 20px 0 10px;
  font-size: 15px;
  font-weight: 700;
}

.input-wrap {
  position: relative;
}

.input-wrap input {
  width: 100%;
  height: 62px;
  padding: 0 58px;
  border: 1.5px solid var(--border);
  border-radius: 15px;
  background: #101e35;
  color: #fff;
  font-size: 22px;
  letter-spacing: 9px;
  outline: none;
  transition: .2s;
}

.input-wrap input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px #08d9ed20;
}

.input-wrap input::placeholder {
  color: #8193b0;
  font-size: 17px;
  letter-spacing: 5px;
}

.lock-icon {
  position: absolute;
  left: 17px;
  top: 50%;
  transform: translateY(-50%);
  width: 23px;
  height: 23px;
  color: #a9d9ff;
  pointer-events: none;
}

.eye-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #a9c8e7;
  cursor: pointer;
}

.eye-btn:hover {
  color: var(--cyan);
  background: #ffffff0c;
}

.eye-btn svg {
  width: 23px;
  height: 23px;
}

.hint {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 25px;
}

.hint-icon {
  width: 37px;
  height: 37px;
  color: var(--cyan);
  flex-shrink: 0;
}

.hint strong {
  color: var(--cyan);
  font-size: 15px;
}

.hint p {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.submit-btn {
  width: 100%;
  min-height: 67px;
  margin-top: 30px;
  border: none;
  border-radius: 17px;
  background: linear-gradient(100deg, #08d9e8, #0875ff);
  color: white;
  font-size: 19px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 25px #087dff40;
  transition: .2s;
}

.submit-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.submit-btn:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

.status {
  min-height: 24px;
  margin-top: 17px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

.error {
  color: #ff8585;
}

.success {
  color: #39e9ad;
}

.footer {
  margin-top: 24px;
  text-align: center;
  color: #8496b5;
  font-size: 12px;
  line-height: 1.7;
}

@media(max-width: 400px) {
  .card {
    padding: 27px 18px;
    border-radius: 23px;
  }

  .brand img {
    width: 170px;
    height: 60px;
  }

  .security-logo {
    width: 155px;
    height: 135px;
  }

  .input-wrap input {
    height: 58px;
  }
}
</style>
</head>

<body>

<main class="card">

  <!-- TOP SWIFTPAYS BRAND LOGO -->
  <div class="brand">
    <img
      src="https://swiftpays.pages.dev/logo.png"
      alt="SwiftPays Logo"
    >
  </div>

  <!-- YOUR LOGO INSTEAD OF SHIELD ICON -->
  <img
    src="https://swiftpays.pages.dev/logo.png"
    alt="SwiftPays Security Logo"
    class="security-logo"
  >

  <h1>Create Your Security <span>PIN</span></h1>

  <p class="subtitle">
    Set a 6-digit PIN to secure your SwiftPays
    account and transactions.
  </p>

  <form id="pinForm">

    <!-- ENTER PIN -->
    <label for="pin">Enter 6-digit PIN</label>

    <div class="input-wrap">

      <svg class="lock-icon" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        placeholder="••••••"
        autocomplete="new-password"
        required
      >

      <button
        class="eye-btn"
        type="button"
        aria-label="Show PIN"
        aria-pressed="false"
        onclick="togglePin('pin', this)"
      >
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 3 21 21"/>
        </svg>
      </button>

    </div>

    <!-- CONFIRM PIN -->
    <label for="confirmPin">Confirm PIN</label>

    <div class="input-wrap">

      <svg class="lock-icon" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>

      <input
        id="confirmPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        placeholder="••••••"
        autocomplete="new-password"
        required
      >

      <button
        class="eye-btn"
        type="button"
        aria-label="Show PIN"
        aria-pressed="false"
        onclick="togglePin('confirmPin', this)"
      >
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 3 21 21"/>
        </svg>
      </button>

    </div>

    <!-- SECURITY TIP -->
    <div class="hint">

      <svg class="hint-icon" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>

      <div>
        <strong>Use a strong PIN</strong>
        <p>Avoid simple patterns like 123456 or 000000.</p>
      </div>

    </div>

    <button class="submit-btn" id="submitBtn" type="submit">
      Create PIN &nbsp;➜
    </button>

  </form>

  <div id="status" class="status"
    role="status" aria-live="polite"></div>

  <div class="footer">
    🔐 Your security is our priority.
    <br>
    © SwiftPays. All rights reserved.
  </div>

</main>

<script>
"use strict";

/* =================================
   BACKEND CONFIGURATION
================================= */

const API_BASE =
  "https://swiftpay-api-6azu.onrender.com";

/* =================================
   ELEMENTS
================================= */

const form = document.getElementById("pinForm");
const pinInput = document.getElementById("pin");
const confirmInput = document.getElementById("confirmPin");
const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

/* =================================
   STATUS MESSAGE
================================= */

function showStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

/* =================================
   SHOW / HIDE EYE ICONS
================================= */

const eyeOpen = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
<circle cx="12" cy="12" r="3"/>
</svg>`;

const eyeClosed = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M3 3 21 21"/>
<path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8"/>
<path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/>
<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
</svg>`;

function togglePin(id, button) {
  const input = document.getElementById(id);
  const showing = input.type === "password";

  input.type = showing ? "text" : "password";
  button.innerHTML = showing ? eyeOpen : eyeClosed;

  button.setAttribute("aria-pressed", String(showing));
  button.setAttribute(
    "aria-label",
    showing ? "Hide PIN" : "Show PIN"
  );
}

/* =================================
   NUMERIC INPUT ONLY
================================= */

[pinInput, confirmInput].forEach(input => {
  input.addEventListener("input", () => {
    input.value = input.value
      .replace(/[^0-9]/g, "")
      .slice(0, 6);
  });
});

/* =================================
   REGISTRATION TOKEN
================================= */

const params = new URLSearchParams(window.location.search);

const setupToken =
  params.get("token") ||
  sessionStorage.getItem("swiftpays_setup_token");

if (setupToken) {
  sessionStorage.setItem(
    "swiftpays_setup_token",
    setupToken
  );
} else {
  showStatus(
    "Registration session missing. Please register again.",
    "error"
  );
  submitBtn.disabled = true;
}

/* =================================
   WEAK PIN VALIDATION
================================= */

function isWeakPin(pin) {
  const weakPins = [
    "000000",
    "111111",
    "123456",
    "654321",
    "112233",
    "121212",
    "222222",
    "333333",
    "444444",
    "555555",
    "666666",
    "777777",
    "888888",
    "999999"
  ];

  return weakPins.includes(pin);
}

/* =================================
   CREATE PIN API
================================= */

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const pin = pinInput.value.trim();
  const confirmPin = confirmInput.value.trim();

  const token =
    setupToken ||
    sessionStorage.getItem("swiftpays_setup_token");

  if (!token) {
    showStatus(
      "Registration session expired. Please register again.",
      "error"
    );
    return;
  }

  if (!/^[0-9]{6}$/.test(pin)) {
    showStatus(
      "Please enter a valid 6-digit PIN.",
      "error"
    );
    pinInput.focus();
    return;
  }

  if (!/^[0-9]{6}$/.test(confirmPin)) {
    showStatus(
      "Please confirm your 6-digit PIN.",
      "error"
    );
    confirmInput.focus();
    return;
  }

  if (pin !== confirmPin) {
    showStatus(
      "Both PINs do not match.",
      "error"
    );
    confirmInput.focus();
    return;
  }

  if (isWeakPin(pin)) {
    showStatus(
      "This PIN is too easy to guess. Choose a stronger PIN.",
      "error"
    );
    pinInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating Secure PIN...";

  showStatus(
    "Please wait. Securing your account..."
  );

  try {

    const response = await fetch(
      API_BASE + "/auth/setup-pin",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          setup_token: token,
          pin: pin
        })
      }
    );

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {

      let message =
        result.detail ||
        result.message ||
        "Unable to create PIN. Please try again.";

      if (Array.isArray(message)) {
        message = message
          .map(item => item.msg || "")
          .join(", ");
      }

      throw new Error(String(message));
    }

    if (!result.token) {
      throw new Error(
        "Session token was not returned by the server."
      );
    }

    /* SAVE AUTHENTICATED SESSION */

    localStorage.setItem(
      "swiftpays_token",
      result.token
    );

    if (result.user) {
      localStorage.setItem(
        "swiftpays_user",
        JSON.stringify(result.user)
      );
    }

    sessionStorage.removeItem(
      "swiftpays_setup_token"
    );

    showStatus(
      "Your PIN has been created successfully! Redirecting...",
      "success"
    );

    submitBtn.textContent = "PIN Created ✓";

    /* DASHBOARD REDIRECT */

    setTimeout(() => {
      window.location.replace("/dashboard.html");
    }, 1200);

  } catch (error) {

    showStatus(
      error.message ||
      "Something went wrong. Please try again.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Create PIN ➜";

  }

});
</script>

</body>
</html>
