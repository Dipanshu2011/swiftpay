
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030719">
<title>Create Security PIN | SwiftPays</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at top left, #0756a955, transparent 40%),
    radial-gradient(ellipse at bottom right, #0756a955, transparent 40%),
    #030719;
}

.card {
  width: 100%;
  max-width: 550px;
  padding: 32px 25px;
  border: 1.5px solid #168bff;
  border-radius: 30px;
  background: linear-gradient(145deg,#06152e,#050b20);
  box-shadow: 0 0 35px #087dff35;
}

.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.logo-icon {
  font-size: 53px;
  font-weight: 900;
  font-style: italic;
  line-height: 1;
  background: linear-gradient(130deg,#00eaff,#0874ff);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 20px #00bfff55;
}

.logo-name {
  font-size: 34px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: -1.5px;
}

.logo-name span {
  color: #10d9ef;
}

.shield {
  width: 105px;
  height: 115px;
  margin: 0 auto 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  filter: drop-shadow(0 0 15px #00bfff77);
}

.shield svg {
  width: 100%;
  height: 100%;
}

h1 {
  text-align: center;
  font-size: clamp(25px,6vw,34px);
  margin-bottom: 12px;
}

h1 span {
  color: #10d9ef;
}

.subtitle {
  text-align: center;
  color: #aebed8;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 20px 0 10px;
  font-size: 15px;
  font-weight: 700;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 62px;
  padding: 0 55px 0 55px;
  border: 1.5px solid #3988d5;
  border-radius: 15px;
  background: #101d35;
  color: white;
  font-size: 23px;
  letter-spacing: 9px;
  outline: none;
}

input:focus {
  border-color: #00dff5;
  box-shadow: 0 0 0 3px #00dff522;
}

input::placeholder {
  color: #8798b5;
  font-size: 14px;
  letter-spacing: 2px;
}

.lock {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  color: #9bdcff;
}

.toggle {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #a9d9ff;
  font-size: 20px;
  cursor: pointer;
}

.hint {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  align-items: center;
}

.hint-icon {
  font-size: 32px;
  color: #10d9ef;
}

.hint strong {
  color: #10d9ef;
  font-size: 15px;
}

.hint p {
  color: #aebed8;
  font-size: 12px;
  margin-top: 5px;
  line-height: 1.5;
}

.submit {
  width: 100%;
  min-height: 68px;
  margin-top: 30px;
  border: none;
  border-radius: 17px;
  background: linear-gradient(100deg,#08d9e8,#0875ff);
  color: white;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 25px #087dff44;
}

.submit:disabled {
  opacity: .6;
  cursor: wait;
}

.status {
  min-height: 25px;
  margin-top: 17px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

.error { color: #ff8585; }
.success { color: #38e9ae; }

.footer {
  margin-top: 24px;
  text-align: center;
  color: #8295b7;
  font-size: 12px;
}

@media(max-width:400px) {
  .card { padding: 27px 18px; }
  .logo-name { font-size: 29px; }
  input { height: 58px; }
}
</style>
</head>

<body>

<main class="card">

  <!-- SWIFTPAYS LOGO -->
  <div class="logo">
    <div class="logo-icon">ϟ</div>
    <div class="logo-name">Swift<span>Pays</span></div>
  </div>

  <!-- SECURITY SHIELD -->
  <div class="shield">
    <svg viewBox="0 0 120 130" fill="none">
      <defs>
        <linearGradient id="shieldGradient" x1="10" y1="5" x2="110" y2="125">
          <stop stop-color="#00EFFF"/>
          <stop offset="1" stop-color="#0875FF"/>
        </linearGradient>
      </defs>

      <path d="M60 5 L108 25 V60
      C108 91 88 112 60 127
      C32 112 12 91 12 60 V25 Z"
      fill="#09244B"
      stroke="url(#shieldGradient)"
      stroke-width="5"/>

      <rect x="43" y="55" width="34" height="29"
      rx="7" fill="white"/>

      <path d="M49 55 V45
      C49 30 71 30 71 45 V55"
      stroke="white" stroke-width="6"
      stroke-linecap="round"/>

      <circle cx="60" cy="68" r="4" fill="#0875FF"/>
      <path d="M60 70 V76" stroke="#0875FF" stroke-width="3"/>
    </svg>
  </div>

  <h1>Create Your Security <span>PIN</span></h1>

  <p class="subtitle">
    Set a 6-digit PIN to secure your SwiftPays
    account and transactions.
  </p>

  <form id="pinForm">

    <label for="pin">Enter 6-digit PIN</label>
    <div class="input-wrap">
      <span class="lock">🔒</span>
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        placeholder="••••••"
        autocomplete="new-password"
        required>
      <button class="toggle" type="button"
        onclick="togglePin('pin',this)">◉</button>
    </div>

    <label for="confirmPin">Confirm PIN</label>
    <div class="input-wrap">
      <span class="lock">🔒</span>
      <input
        id="confirmPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        placeholder="••••••"
        autocomplete="new-password"
        required>
      <button class="toggle" type="button"
        onclick="togglePin('confirmPin',this)">◉</button>
    </div>

    <div class="hint">
      <div class="hint-icon">🛡</div>
      <div>
        <strong>Use a strong PIN</strong>
        <p>Avoid simple patterns like 123456 or 000000.</p>
      </div>
    </div>

    <button class="submit" id="submitBtn" type="submit">
      Create PIN &nbsp;➜
    </button>

  </form>

  <div class="status" id="status" role="status"></div>

  <div class="footer">
    🔐 Your security is our priority.
    <br><br>
    © SwiftPays. All rights reserved.
  </div>

</main>

<script>
"use strict";

const API = "https://swiftpay-api-6azu.onrender.com";

const form = document.getElementById("pinForm");
const pinInput = document.getElementById("pin");
const confirmInput = document.getElementById("confirmPin");
const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

function showStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function togglePin(id, button) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  button.textContent = input.type === "password" ? "◉" : "◎";
}

[pinInput, confirmInput].forEach(input => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 6);
  });
});

// Get registration setup token
const params = new URLSearchParams(window.location.search);

let setupToken =
  params.get("token") ||
  sessionStorage.getItem("swiftpays_setup_token");

if (!setupToken) {
  showStatus(
    "Registration session missing. Please register again.",
    "error"
  );
  submitBtn.disabled = true;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const pin = pinInput.value.trim();
  const confirmPin = confirmInput.value.trim();

  if (!setupToken) {
    showStatus("Registration session expired. Please register again.", "error");
    return;
  }

  if (!/^[0-9]{6}$/.test(pin)) {
    showStatus("Please enter a valid 6-digit PIN.", "error");
    return;
  }

  if (pin !== confirmPin) {
    showStatus("Both PINs do not match.", "error");
    return;
  }

  if (pin === "123456" || pin === "000000" ||
      pin === "111111" || pin === "654321") {
    showStatus("Please choose a stronger PIN.", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating Secure PIN...";
  showStatus("Please wait. Securing your account...");

  try {
    const response = await fetch(API + "/auth/setup-pin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        setup_token: setupToken,
        pin: pin
      })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        result.detail || "Unable to create PIN. Please try again."
      );
    }

    if (!result.token) {
      throw new Error("Account created, but login token was not returned.");
    }

    // Save authenticated session
    localStorage.setItem("swiftpays_token", result.token);

    if (result.user) {
      localStorage.setItem(
        "swiftpays_user",
        JSON.stringify(result.user)
      );
    }

    sessionStorage.removeItem("swiftpays_setup_token");

    showStatus(
      "Your PIN is created successfully! Redirecting...",
      "success"
    );

    submitBtn.textContent = "PIN Created ✓";

    setTimeout(() => {
      window.location.replace("/dashboard.html");
    }, 1200);

  } catch (error) {
    showStatus(
      error.message || "Something went wrong. Please try again.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Create PIN ➜";
  }
});
</script>

</body>
</html>
